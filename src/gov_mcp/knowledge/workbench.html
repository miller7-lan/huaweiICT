<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>政务知识更新工作台</title>
<style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#20352f;background:#f3f5f0}*{box-sizing:border-box}body{margin:0}header{background:#173e32;color:white;padding:30px 5vw}header small{color:#bad0c4;letter-spacing:.12em}h1{margin:10px 0;font-size:30px}header p{margin:0;color:#d8e7df}main{max-width:1250px;padding:24px;margin:auto}.card{background:#fff;border:1px solid #dae2d9;border-radius:12px;padding:22px;margin-bottom:18px}h2{font-size:18px;margin:0 0 16px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}button{background:#245640;color:#fff;border:0;padding:10px 16px;border-radius:6px;cursor:pointer}button.secondary{background:#e7eee6;color:#254a36}input{padding:11px;border:1px solid #b9c8b8;border-radius:6px;max-width:100%}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;padding:12px 8px;border-bottom:1px solid #e5ebe2;vertical-align:top;word-break:break-word}th{color:#637866}code{font-size:12px;word-break:break-all}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric b{display:block;font-size:24px;margin-bottom:8px}.muted{color:#6d7c6d;font-size:13px}.badge{padding:5px 8px;border-radius:5px;background:#edf2e9;display:inline-block}.alert{padding:13px;background:#fff4d8;border-radius:7px;color:#6b531d}#message{position:sticky;top:10px;white-space:pre-wrap}#content[hidden],#login[hidden]{display:none}details{margin:12px 0}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f6f2;padding:12px;font-size:12px}a{color:#236b52}.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}.scroll{overflow:auto}@media(max-width:800px){.metrics,.split{grid-template-columns:1fr 1fr}header{padding:22px}main{padding:15px}}@media(max-width:500px){.metrics,.split{grid-template-columns:1fr}}
</style>
<header><small>ICT · GOVERNMENT KNOWLEDGE</small><h1>知识更新工作台</h1><p>定期发现变化，让每次更新有来源、有复核、有版本。</p></header><main>
<div id="message"></div><section id="login" class="card"><h2>维护者登录</h2><p class="muted">使用已获本工作台维护权限的 Nexent 账号。服务密钥不能用于确认发布。</p><form id="loginForm" class="row"><input id="email" type="email" placeholder="邮箱" autocomplete="username" required><input id="password" type="password" placeholder="密码" autocomplete="current-password" required><button>登录</button></form></section>
<div id="content" hidden><section class="metrics" id="metrics"></section><section class="card"><div class="row"><button id="check">立即检查</button><button class="secondary" id="pause">暂停自动检查</button><button class="secondary" id="resume">恢复自动检查</button><button class="secondary" id="demo">切换演示频率</button><button class="secondary" id="refresh">刷新状态</button><button class="secondary" id="logout">退出</button></div><p id="mode" class="muted"></p></section>
<section class="card"><h2>来源与检查状态</h2><p class="muted">仅检查已登记、已确认的固定页面和附件。来源配置在本机私有运行目录，修改后重启服务。</p><div id="sources" class="scroll"></div></section>
<div class="split"><section class="card"><h2>运行记录</h2><div id="runs"></div></section><section class="card"><h2>处理队列</h2><div id="jobs"></div></section></div>
<section class="card"><h2>待复核知识候选</h2><p class="alert">自动更新的是资料原文与候选标签。业务知识及本体变更需要逐项核对原文、适用范围和冲突，再由维护者确认。</p><div id="candidates"></div></section>
<section class="card"><h2>知识与原文查询</h2><form id="searchForm" class="row"><input id="query" placeholder="例如：申请表" required><select id="kind"><option value="documents">资料原文（可能待复核）</option><option value="rules">已确认知识</option></select><button>查询</button></form><div id="results"></div></section>
<section class="card"><h2>历史版本</h2><p class="muted">回退保留历史记录；检索引用绑定具体版本。</p><div id="versions"></div></section></div></main>
<script>
let state;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=t=>t?new Date(t*1000).toLocaleString('zh-CN'):'—';const short=s=>s?s.slice(0,12):'尚无版本';const labels={completed:'已完成',working:'处理中',processed:'已整理',queued:'排队中',waiting_credentials:'等待密钥',waiting_retry:'等待重试',failed:'检查失败',changed:'发现变化',unchanged:'没有变化',classified:'已分类',extracted:'已提取',validated:'已核验',finished:'已整理',pending_review:'待复核',accepted:'已确认',rejected:'已拒绝',waiting_sources:'等待配置来源',superseded:'已被新版替代',MISSING_API_KEY:'等待 Jev 密钥',NATIVE_EXECUTION_FAILED:'模型执行未完成',INCOMPLETE_AGENT_WORK:'部分任务尚未完成',idle:'等待检查',running:'正在处理',no_model_work:'本轮无需模型处理'};const label=s=>labels[s]||s||'—';
async function api(path,body){const r=await fetch(path,{method:body===undefined?'GET':'POST',headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const v=await r.json();if(!r.ok){if(r.status===401){$('login').hidden=false;$('content').hidden=true}throw Error(v.message_code||'操作失败')}return v}
function message(s){$('message').className='alert';$('message').textContent=s}
function table(headers,rows){return '<table><thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
async function refresh(){try{state=await api('/api/state');$('login').hidden=true;$('content').hidden=false;const h=state.heartbeat||{};$('metrics').innerHTML=[['服务状态',label(h.status)],['待复核',state.candidates.filter(c=>c.status==='pending_review').length],['资料版本',short(state.active_documents)],['正式知识版本',short(state.active_rules)]].map(([a,b])=>'<div class="card metric"><b>'+esc(b)+'</b><span class="muted">'+esc(a)+'</span></div>').join('');$('mode').textContent=(state.paused?'自动检查已暂停。':'自动检查已启用。')+' 检查间隔 '+state.interval+' 秒；上次服务心跳 '+date(h.at)+'。'+(state.synthetic_mode?'当前是独立模拟环境；Jev 使用明确标注的接口回放。':'');$('sources').innerHTML=state.configured_sources.length?table(['来源','检查结果','上次／下次','错误'],state.configured_sources.map(s=>{const v=state.sources.find(x=>x.id===s.id)||{};return[esc(s.title)+'<br><code>'+esc(s.url)+'</code>',esc(label(v.status)),esc(date(v.last_check))+'<br>'+esc(date(v.next_check)),esc(v.error||'—')]})):'<p class="alert">尚未配置政务官网，当前不会抓取任何站点。</p>';$('runs').innerHTML=table(['运行','状态','时间'],state.runs.slice(0,8).map(r=>['<code>'+esc(short(r.id))+'</code>',esc(label(r.status)),esc(date(r.started_at))]));$('jobs').innerHTML=table(['来源','阶段','状态'],state.jobs.slice(0,10).map(j=>[esc(j.source_id),esc(label(j.stage)),esc(label(j.status))+'<br>'+esc(j.error||'')]));$('candidates').innerHTML=state.candidates.map(c=>'<details><summary>'+esc(label(c.status))+' · '+esc(c.source_id)+' · '+c.claims.length+' 条候选</summary><pre>'+esc(JSON.stringify({claims:c.claims,ontology_proposals:c.ontology_proposals,validation:c.validation},null,2))+'</pre>'+(c.status==='pending_review'?'<label><input type="checkbox" id="ack-'+c.id+'"> 我已核对原文、适用范围、冲突及本体变更</label><p class="row"><button data-review="'+c.id+'">确认发布</button><button class="secondary" data-reject="'+c.id+'">拒绝</button><button class="secondary" data-recheck="'+c.id+'">重新核验</button></p>':'')+'</details>').join('')||'<p class="muted">暂时没有候选。</p>';$('versions').innerHTML=table(['类型','版本','创建时间','操作'],state.versions.map(v=>[v.kind==='documents'?'资料层':'已确认知识','<code>'+esc(v.id)+'</code>',esc(date(v.created_at)),'<button class="secondary" data-rollback="'+v.id+'" data-kind="'+v.kind+'">回退至此版本</button>']));}catch(e){message(e.message)}}
async function action(name,body={}){try{await api('/api/actions/'+name,body);message('操作已记录。');await refresh()}catch(e){message(e.message)}}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/login',{email:$('email').value,password:$('password').value});$('password').value='';$('message').className='';$('message').textContent='';await refresh()}catch(e){message(e.message)}};
for(const name of ['check','pause','resume'])$(name).onclick=()=>action(name);$('demo').onclick=()=>action('demo',{enabled:!state.demo_mode});$('refresh').onclick=refresh;$('logout').onclick=async()=>{await api('/api/logout',{});$('login').hidden=false;$('content').hidden=true};
$('candidates').onclick=e=>{const b=e.target;if(b.dataset.review){const id=b.dataset.review;action('review',{candidate_id:id,expected_base:state.active_rules,acknowledge:$('ack-'+id).checked,accept:true})}if(b.dataset.reject)action('review',{candidate_id:b.dataset.reject,expected_base:state.active_rules,acknowledge:false,accept:false});if(b.dataset.recheck)action('recheck',{candidate_id:b.dataset.recheck})};
$('versions').onclick=e=>{if(e.target.dataset.rollback&&confirm('确认切换到这个历史版本？历史记录会保留。'))action('rollback',{kind:e.target.dataset.kind,version:e.target.dataset.rollback,expected_base:state['active_'+e.target.dataset.kind]})};
$('searchForm').onsubmit=async e=>{e.preventDefault();try{const v=await api('/api/search?q='+encodeURIComponent($('query').value)+'&kind='+$('kind').value);$('results').innerHTML='<p>'+esc(v.notice||'暂无内容')+'</p><code>'+esc(v.version||'')+'</code>'+v.items.map(i=>'<article><pre>'+esc(i.content||i.quote)+'</pre><p>'+esc(JSON.stringify(i.locator||i.source_segment_ids))+'</p>'+(i.raw_sha256?'<a target="_blank" rel="noopener" href="/api/original/'+(i.evidence_version||v.version)+'/'+i.raw_sha256+'">查看此版本原件</a>':'')+'</article>').join('')}catch(e){message(e.message)}};refresh();setInterval(()=>{if(!$('content').hidden)refresh()},15000);
</script></html>
