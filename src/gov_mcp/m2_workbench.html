<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M2 事项协作演示</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f1;color:#252522;font:16px/1.65 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1080px;margin:35px auto;padding:0 24px}h1{font-size:27px;margin:0}h2{font-size:20px;margin:0 0 14px}h3{font-size:17px;margin:0 0 8px}.intro{color:#55554e;margin:6px 0 24px}.notice{padding:12px 16px;border-left:3px solid #787468;background:#ebe9e0;margin-bottom:22px}section{padding:24px;background:#fff;border:1px solid #d8d6cd;margin:18px 0}label{display:block;margin:14px 0 5px}input,textarea,select{font:inherit;padding:10px;border:1px solid #b8b7b0;border-radius:3px;background:white}input,textarea{width:100%}textarea{min-height:85px;resize:vertical}button{font:inherit;padding:9px 17px;margin:14px 9px 0 0;border:1px solid #33332d;border-radius:3px;background:#33332d;color:white;cursor:pointer}button.secondary{background:white;color:#33332d}button:disabled{opacity:.45;cursor:wait}.row{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.row label{margin:6px 0}.row select{min-width:155px}.muted{color:#68685f;font-size:14px}.small{font-size:13px;word-break:break-all}.citation{padding:16px 0;border-top:1px solid #ddd}.citation a{color:#333;text-underline-offset:3px}.citation p{margin:7px 0}.status{padding:10px 0;white-space:pre-line}.hidden{display:none}table{width:100%;border-collapse:collapse;margin:12px 0}th,td{padding:10px;text-align:left;border-bottom:1px solid #ddd;font-weight:normal}th{font-weight:600}details{margin-top:16px}pre{font-size:12px;white-space:pre-wrap;word-break:break-all;background:#f5f5f2;padding:12px}#confirmFlag{width:auto}footer{padding:10px 0 30px;color:#777;font-size:13px}
</style></head><body><main>
<h1>M2 事项协作演示</h1><p class="intro">群众引导 → 保存交接 → 工作人员核验</p>
<div class="notice">工程演示 · 官方资料及材料规则待业务复核。页面只记录模拟材料的存在状态，不接收身份证照片、号码或真实申请人资料，不提供正式审批结论。</div>
<section id="loginSection"><h2>登录</h2><form id="loginForm"><label for="email">邮箱</label><input id="email" type="email" autocomplete="username" required><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">登录</button></form></section>
<div id="app" class="hidden"><div class="row"><span id="role"></span><button id="logout" class="secondary">退出登录</button></div><p id="version" class="muted"></p>
<section id="citizen" class="hidden"><h2>1. 群众引导</h2><p class="muted">候选范围：郑州市二七区，成年人、本地户籍、本人到期换领。</p><label for="question">想了解的问题</label><textarea id="question">身份证到期换领需要哪些材料？户口簿和原身份证应如何核实？</textarea><button id="create">建立演示任务</button><button id="guide" disabled>运行群众 Agent，检索官方依据</button><div id="taskInfo" class="small"></div><div id="citations"></div>
<h3 style="margin-top:24px">2. 模拟材料声明与交接</h3><p class="muted">户口簿是否适用于当前分支仍待人工核实；勾选“存在”不代表已经验证材料真实有效。</p><div class="row"><label for="identityCard">原居民身份证</label><select id="identityCard"><option value="unknown">未确认</option><option value="present">模拟存在</option><option value="missing">模拟缺少</option></select><label for="householdRegister">居民户口簿</label><select id="householdRegister"><option value="unknown">未确认</option><option value="present">模拟存在</option><option value="missing">模拟缺少</option></select></div><button id="handoff" disabled>保存声明并交接</button><div id="handoffInfo" class="status"></div></section>
<section id="staff" class="hidden"><h2>3. 工作人员核验</h2><button id="queue" class="secondary">刷新交接队列</button><div id="queueInfo"></div><button id="assess" disabled>运行工作人员 Agent，核验最新交接</button><div id="assessment" class="status"></div><div id="staffCitations"></div><label><input id="confirmFlag" type="checkbox"> 已查看本次演示核验结果，并知晓业务规则仍待复核</label><button id="confirm" disabled>记录演示确认</button></section>
<details><summary>本次调用记录</summary><pre id="raw"></pre></details></div>
<div id="message" class="status" role="status" aria-live="polite"></div><footer>少量资料验证流程；按来源、地区、事项、材料类别、适用条件和知识版本逐步扩充。</footer>
</main><script>
const $=id=>document.getElementById(id);let task=null,idempotency=null,assessment=null;
const labels={PREVIEW_EVIDENCE_FOUND:'已返回官方原文，材料规则仍待业务复核。',HANDOFF_CREATED:'交接已保存。',HANDOFF_REUSED:'已使用原交接，没有重复创建。',DEMO_REVIEW_RECORDED:'演示确认已记录，业务规则复核和正式审批仍未完成。'};
async function request(path,body){const r=await fetch(path,{method:body===undefined?'GET':'POST',headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const v=await r.json();$('raw').textContent=JSON.stringify(v,null,2);if(!r.ok)throw Error(v.message_code||v.result?.message_code||'请求失败');return v}
async function tool(name,body={}){const v=await request('/api/tools/'+name,body);if(v.status==='ERROR'||v.status==='BLOCKED')throw Error(v.message_code);return v}
function citations(target,items){$(target).replaceChildren();for(const c of items||[]){const div=document.createElement('div');div.className='citation';const a=document.createElement('a');a.textContent=c.title+' · '+c.locator;a.href=c.url;a.target='_blank';a.rel='noopener noreferrer';const p=document.createElement('p');p.textContent=c.quote;const note=document.createElement('div');note.className='muted';note.textContent='来源待业务复核 · '+c.region+' · 分类：'+c.category;div.append(a,p,note);$(target).append(div)}}
async function busy(button,action){button.disabled=true;$('message').textContent='正在执行…';try{await action();$('message').textContent='本次操作已完成。'}catch(e){$('message').textContent='操作停止：'+e.message}finally{button.disabled=false}}
async function load(){const v=await request('/api/state');if(v.status!=='OK')throw Error(v.message_code);$('loginSection').classList.add('hidden');$('app').classList.remove('hidden');const role=v.data.role;$('role').textContent='已核定业务角色：'+(role==='citizen'?'群众':'工作人员');$('version').textContent='工程预览知识版本：'+v.knowledge_version;$('citizen').classList.toggle('hidden',role!=='citizen');$('staff').classList.toggle('hidden',role!=='staff');if(role==='staff')await queue()}
async function queue(){const v=await tool('list_handoffs');$('queueInfo').replaceChildren();const table=document.createElement('table');const header=document.createElement('tr');for(const title of ['交接编号','知识版本','状态']){const th=document.createElement('th');th.textContent=title;header.append(th)}table.append(header);for(const item of v.items){const row=document.createElement('tr');for(const text of [item.handoff_id,item.version_id,item.state]){const td=document.createElement('td');td.textContent=text;td.className='small';row.append(td)}table.append(row)}$('queueInfo').append(table);$('assess').disabled=v.items.length===0}
$('loginForm').addEventListener('submit',e=>{e.preventDefault();busy(e.submitter,async()=>{await request('/api/login',{email:$('email').value,password:$('password').value});$('password').value='';$('email').value='';await load()})});
$('logout').onclick=()=>busy($('logout'),async()=>{await request('/api/logout',{});location.reload()});
$('create').onclick=()=>busy($('create'),async()=>{const v=await tool('create_task',{question:$('question').value});task=v.data.task_id;idempotency=crypto.randomUUID();$('taskInfo').textContent='演示任务：'+task+' · 版本：'+v.knowledge_version;$('guide').disabled=false;$('handoff').disabled=true;$('handoffInfo').textContent='';$('citations').replaceChildren()});
$('guide').onclick=()=>busy($('guide'),async()=>{const response=await request('/api/agent',{});const v=response.result;if(v.status!=='OK')throw Error(v.message_code);if(v.data.task_id!==task)throw Error('任务不一致，已停止');citations('citations',v.citations);$('handoff').disabled=false;$('taskInfo').textContent+=' · 实际 Agent 会话：'+response.conversation_id});
$('handoff').onclick=()=>busy($('handoff'),async()=>{await tool('declare_materials',{task_id:task,materials:{identity_card:$('identityCard').value,household_register:$('householdRegister').value}});const v=await tool('create_handoff',{task_id:task,idempotency_key:idempotency});$('handoffInfo').textContent=(labels[v.message_code]||v.message_code)+'\n交接编号：'+v.data.handoff_id+'\n版本：'+v.knowledge_version});
$('queue').onclick=()=>busy($('queue'),queue);
$('assess').onclick=()=>busy($('assess'),async()=>{const response=await request('/api/agent',{});const v=response.result;if(v.status!=='OK')throw Error(v.message_code);assessment=v;$('confirmFlag').checked=false;$('confirm').disabled=true;$('assessment').textContent='交接：'+v.data.handoff_id+'\n实际 Agent 会话：'+response.conversation_id+'\n演示缺项：'+(v.data.missing_draft_items.join('、')||'无')+'\n未确认材料：'+(v.data.unknown_items.join('、')||'无')+'\n业务复核待办：'+v.data.source_review_pending.join('；')+'\n本结果不代表正式审批。';citations('staffCitations',v.citations)});
$('confirmFlag').onchange=()=>{$('confirm').disabled=!assessment||!$('confirmFlag').checked};
$('confirm').onclick=()=>busy($('confirm'),async()=>{if(!$('confirmFlag').checked)throw Error('请先查看并确认演示结果');const v=await tool('confirm_review',{handoff_id:assessment.data.handoff_id,assessment_sha256:assessment.data.assessment_sha256,confirmed:true});$('assessment').textContent+='\n'+labels[v.message_code];await queue()});
</script></body></html>
