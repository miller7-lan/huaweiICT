<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>ICT 项目流程图与源码详解</title>
<style>
:root{--ink:#183049;--muted:#64768b;--line:#dbe4ed;--blue:#245b9c;--paper:#f3f6fa}*{box-sizing:border-box}body{margin:0;font:14px/1.65 "Microsoft YaHei","Segoe UI",sans-serif;color:var(--ink);background:var(--paper)}button,input,select{font:inherit}button,a{touch-action:manipulation}button{border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink);padding:7px 12px;cursor:pointer}button:hover{border-color:var(--blue);color:var(--blue)}button.active{background:var(--blue);color:white;border-color:var(--blue)}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}header{padding:24px 30px 18px;background:#142e49;color:white}header h1{margin:0;font-size:25px;letter-spacing:1px}header p{margin:5px 0 0;color:#bfd0e3}header .meta{margin-top:10px;font-size:12px;color:#c9d6e6}.top{position:sticky;top:0;z-index:5;padding:12px 24px;background:white;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}.spacer{flex:1}.main{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 210px)}aside{background:white;border-right:1px solid var(--line);padding:18px 14px;max-height:calc(100vh - 62px);position:sticky;top:62px;overflow:auto}aside h3{font-size:12px;color:var(--muted);letter-spacing:1px;margin:0 8px 10px}aside button{display:block;text-align:left;width:100%;margin-bottom:5px;font-size:13px;border-color:transparent;line-height:1.6}aside button.active{background:#e8f0fc;color:#245b9c;border-color:#d5e2f5}.work{padding:24px;min-width:0}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:18px}.card h2{margin:0 0 9px;font-size:22px}.muted{color:var(--muted)}.callout{padding:13px 16px;background:#fff7e6;border-left:3px solid #d3a243;border-radius:6px;font-size:13px;margin:14px 0}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0}.canvas{overflow:auto;background:white;border:1px solid var(--line);border-radius:10px;max-height:78vh;position:relative}.canvas svg{display:block;max-width:none;transform-origin:top left}.canvas svg .node:focus{outline:none}.canvas svg .node:focus rect{stroke-width:4}.detail{border:1px solid #c9d9ec;background:#f6f9ff;border-radius:9px;padding:16px;margin:14px 0}.detail h3{margin:0 0 6px;font-size:17px}.detail p{margin:5px 0}.legend{display:flex;gap:18px;color:var(--muted);font-size:12px}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{padding:18px;background:white;border:1px solid var(--line);border-radius:10px}.stat strong{display:block;font-size:28px;line-height:1.3}.stat span{font-size:12px;color:var(--muted)}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#f6f8fb;color:#4b627a;font-weight:600}td code{white-space:pre-wrap;overflow-wrap:anywhere}pre{background:#10273e;color:#d8e6f3;padding:18px;overflow:auto;border-radius:8px;white-space:pre;font:12px/1.75 Consolas,"Microsoft YaHei",monospace;max-height:70vh}code{font-family:Consolas,"Microsoft YaHei",monospace;font-size:12px}.source-line{display:block}.ln{display:inline-block;width:48px;color:#7f9bb6;user-select:none}.source-line:target{background:#39516c}.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:7px}.results{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;margin-top:18px}.results-list{max-height:76vh;overflow:auto}.result{display:block;width:100%;text-align:left;margin-bottom:7px;padding:10px;font-size:12px;overflow-wrap:anywhere}.result small{display:block;color:var(--muted)}.event{border-left:3px solid #cbd9e8;padding:8px 11px;margin:6px 0;background:#f6f8fb}.event.branch{border-color:#d7aa43;background:#fff9eb}.event.stop{border-color:#cf7474;background:#fff3f3}.event b{font-size:11px;margin-right:8px;color:var(--muted)}.tag{display:inline-block;font-size:11px;border:1px solid #c8d8e9;border-radius:4px;padding:0 5px;margin:0 4px 3px 0}details{margin:12px 0}summary{cursor:pointer;font-weight:600;padding:8px 0}.hidden{display:none!important}.files-scroll{max-height:72vh;overflow:auto}.small{font-size:12px}.status{display:inline-block;background:#e8eef8;border-radius:4px;padding:2px 6px;color:#355b87}.breadcrumb{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.section-heading{margin:24px 0 12px;font-size:17px}.empty{padding:30px;color:var(--muted)}footer{padding:15px 25px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.main{grid-template-columns:210px minmax(0,1fr)}.results{grid-template-columns:1fr}.results-list{max-height:30vh}}@media(max-width:720px){header{padding:18px}.main{display:block}aside{position:static;max-height:220px;border-bottom:1px solid var(--line)}.work{padding:14px}.top{padding:10px}.card{padding:16px}.grid{grid-template-columns:repeat(2,1fr)}}@media print{.top,aside,.toolbar,.results-list{display:none}.main,.results{display:block}.canvas{overflow:visible;max-height:none}.canvas svg{width:100%!important;height:auto!important}.work{padding:0}.card{break-inside:avoid}header{color:#183049;background:white}header p,header .meta{color:#64768b}pre{white-space:pre-wrap;max-height:none}.detail{break-inside:avoid}}
</style></head><body>
<header><h1>ICT 项目流程图与源码详解</h1><p>从业务入口到条件分支 · 18 张流程图 · 节点逐项注释 · 本地离线查看</p><div class="meta" id="meta"></div></header>
<nav class="top" aria-label="视图"><button data-view="overview" class="active">项目总览</button><button data-view="diagrams">流程图</button><button data-view="symbols">函数与分支</button><button data-view="assets">前端与部署</button><button data-view="interfaces">接口与数据表</button><button data-view="files">文件清单</button><span class="spacer"></span><a href="流程分析.md">分析文档</a><a href="生成校验.json">生成校验</a><button id="print">打印／保存 PDF</button></nav>
<div class="main"><aside id="side"></aside><main class="work" id="work"></main></div><footer>静态源码分析，不代表运行验收。未读取私有运行目录、启用模型、采集官网、启动业务服务、正式发布或推送仓库。</footer>
<script id="atlas-data" type="application/json">__ATLAS_DATA__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('atlas-data').textContent), work=document.getElementById('work'), side=document.getElementById('side');
let view='overview', graphIndex=0, zoom=1, symbolQuery='', fileQuery='';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const symbols=new Map(data.symbols.map(s=>[s.id,s]));
const sourceLink=(path,line=1)=>`<a href="../../${encodeURI(path)}#L${line}" target="_blank" rel="noopener">${esc(path)}:${line}</a>`;
function setView(next){view=next;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));render();}
function sidebar(){side.innerHTML='<h3>流程导航</h3>'+data.diagrams.map((g,i)=>`<button data-graph="${i}" class="${view==='diagrams'&&graphIndex===i?'active':''}">${esc(g.title)}</button>`).join('')+'<h3 style="margin-top:22px">图例与范围</h3><p class="small muted" style="padding:0 8px">蓝色：执行步骤<br>黄色：校验、人工确认或预算门<br>红色：暂停、失败或停止<br><br>每个节点可点开完整注释。细节页包含完整Python源码、条件、异常与调用位置。</p>';side.querySelectorAll('[data-graph]').forEach(b=>b.onclick=()=>{graphIndex=Number(b.dataset.graph);zoom=1;setView('diagrams')});}
function overview(){const s=data.summary;work.innerHTML=`<div class="grid">${[[s.files,'扫描项目文件'],[s.functions,'Python函数'],[s.events,'条件／异常／返回等结构事件'],[s.diagram_nodes,'有源码依据的流程节点']].map(([n,l])=>`<div class="stat"><strong>${n.toLocaleString()}</strong><span>${l}</span></div>`).join('')}</div><section class="card" style="margin-top:18px"><h2>项目有多条独立执行链路</h2><p>8780 决策工作台、公开资料修订库、8775 维护引擎、M1/M2 与原生公开预览分别保留自己的资料、权限和版本。流程图按实际入口拆分，不能把它们视为已经接通的生产自动链。</p><div class="callout">当前仓库默认配置：推理开关 <b>${s.inference_enabled}</b>，填表 AI 开关 <b>${s.form_verifier_enabled}</b>。路由已配置与真实模型已执行是两个判断；本次没有调用模型或重跑业务测试。</div><div class="toolbar"><button id="open-first">查看项目全景图</button><button id="open-source">检索全部函数与错误分支</button></div><table><thead><tr><th>链路</th><th>处理方式</th><th>结果边界</th></tr></thead><tbody><tr><td>8780 决策工作台</td><td>固定模拟快照、三值规则、精确检索与人工分项复核</td><td>工程模拟，不是正式政务审批</td></tr><tr><td>公开资料修订库</td><td>官网采集 → 原件／修订 → 复核 → 独立评测 → scope发布</td><td>未发布资料不会自动用于正式查询</td></tr><tr><td>8775／8778</td><td>独立心跳、Agent候选、分类核验、文档／规则分版本</td><td>真实供应商与synthetic replay分开取证</td></tr><tr><td>8781／8782</td><td>Nexent主控、检索／核验子Agent、DeepSeek英译与Jev</td><td>原文支持与现行要求分开，预算封闭；不正式发布</td></tr><tr><td>M1／M2／资产查询</td><td>环境底座、模拟材料交接、原文和多模态资产检索</td><td>历史演示不替代当前正式业务验证</td></tr></tbody></table></section><section class="card"><h2>细节在哪里</h2><p>18 张主流程图中的每个节点都有完整说明和源码位置。“函数与分支”按 <b>src/ 与 scripts/</b> 的 Python AST 提取模块、类、函数、嵌套函数及完整源代码，同时列出 if/else语义条件、循环、try/except、with、raise/return、条件表达式、短路逻辑与推导式。CSV 保留全部记录，页面搜索最多显示前 200 条匹配，缩小查询可继续查看。</p><p class="muted">AST事件列表是源码结构索引；动态多态、跨线程时序、隐式异常和所有运行输入组合不能由静态扫描证明。非Python前端、配置和脚本列在文件清单，未宣称逐分支解析。私有运行目录、密钥、虚拟环境、依赖镜像和模型权重排除。</p><p>历史状态依据 2026-10-18 接续记录：二七原生预览通过；南京通过；北京重试受外部传输阻断、整轮预算已封闭；短周期心跳试验结束且测试来源暂停。未在本轮重新验证这些状态。</p><p class="small">${s.python_modules} 个业务／脚本Python模块；${s.classes} 个类；${s.test_functions} 个测试函数定义仅作索引；AST解析错误 ${data.parse_errors.length}。</p></section>`;document.getElementById('open-first').onclick=()=>{graphIndex=0;setView('diagrams')};document.getElementById('open-source').onclick=()=>setView('symbols');}
function wrap(text,limit){let rows=[],s='',w=0;for(const c of text){let n=c.codePointAt(0)>255?2:1;if(w+n>limit){rows.push(s);s='';w=0}s+=c;w+=n}if(s)rows.push(s);return rows;}
function svg(g){
  let cols=Math.max(...g.nodes.map(n=>n.col)),width=Math.max(800,(cols+1)*440+120),height=(Math.max(...g.nodes.map(n=>n.row))+1)*186+100;
  let pos=new Map(g.nodes.map(n=>[n.id,[60+n.col*440,70+n.row*186]]));
  let out=`<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(g.title)}" viewBox="0 0 ${width} ${height}" width="${width}" height="${height}"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#72859b"/></marker></defs><text x="60" y="32" fill="#183049" font-size="18" font-weight="700">${esc(g.title)}</text>`;
  for(const [a,b,label] of g.edges){
    let [x,y]=pos.get(a),[tx,ty]=pos.get(b),path,lx,ly;
    if(ty-y>186&&tx===x){
      let outer=x+372;
      path=`M ${x+330} ${y+58} L ${outer} ${y+58} L ${outer} ${ty+58} L ${tx+330} ${ty+58}`;
      lx=outer+6;ly=y+48;
    }else if(ty>y){
      let sx=x+165,sy=y+116,ex=tx+165,ey=ty,mid=(sy+ey)/2;
      path=`M ${sx} ${sy} C ${sx} ${mid},${ex} ${mid},${ex} ${ey}`;lx=(sx+ex)/2;ly=mid-7;
    }else if(ty===y){
      let sx=tx>x?x+330:x,ex=tx>x?tx:tx+330;
      path=`M ${sx} ${y+58} L ${ex} ${ty+58}`;lx=(sx+ex)/2;ly=y+50;
    }else{
      let outer=Math.max(x+330,tx+330)+54;
      path=`M ${x+330} ${y+58} C ${outer} ${y+58},${outer} ${ty+58},${tx+330} ${ty+58}`;lx=outer-10;ly=(y+ty)/2+58;
    }
    out+=`<path d="${path}" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#a)"/><text x="${lx}" y="${ly}" text-anchor="middle" font-size="11" fill="#496176" style="paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round">${esc(label)}</text>`;
  }
  for(const n of g.nodes){
    let[x,y]=pos.get(n.id),[fill,stroke]=n.kind==='gate'?['#fff4d8','#a56b13']:n.kind==='stop'?['#ffeded','#b74343']:['#eef4ff','#3368b7'];
    out+=`<g class="node" data-node="${n.id}" tabindex="0" role="button" aria-label="${esc(n.label)}"><title>${esc(n.note)}</title><rect x="${x}" y="${y}" width="330" height="116" rx="12" fill="${fill}" stroke="${stroke}"/>`;
    wrap(n.label,36).forEach((s,i)=>out+=`<text x="${x+18}" y="${y+27+i*21}" font-size="15" font-weight="700" fill="#183049">${esc(s)}</text>`);
    let description=wrap(n.note,46),shown=description.slice(0,2);
    if(description.length>2)shown[1]=shown[1].replace(/[。；，]$/,'')+'…';
    shown.forEach((s,i)=>out+=`<text x="${x+18}" y="${y+76+i*17}" font-size="11" fill="#486075">${esc(s)}</text>`);out+='</g>';
  }
  return out+'</svg>';
}
function showNode(n){const path=n.ref.split(':')[0];document.getElementById('node-detail').innerHTML=`<h3>${esc(n.label)}</h3><p>${esc(n.note)}</p><p class="breadcrumb">源码：${sourceLink(path,n.line)}${n.ref.includes(':')?' · '+esc(n.ref.slice(n.ref.indexOf(':')+1)):''}</p>${symbols.has(n.ref)?`<button id="inspect-node">查看函数完整源码与全部条件</button>`:''}`;if(symbols.has(n.ref))document.getElementById('inspect-node').onclick=()=>{symbolQuery=n.ref;setView('symbols');showSymbol(symbols.get(n.ref))};}
function diagrams(){const g=data.diagrams[graphIndex];work.innerHTML=`<section class="card"><h2>${esc(g.title)}</h2><p class="muted">${esc(g.subtitle)}</p><div class="legend"><span><i class="dot" style="background:#3368b7"></i>执行</span><span><i class="dot" style="background:#d3a243"></i>检查／确认</span><span><i class="dot" style="background:#b74343"></i>失败／暂停</span></div><div class="toolbar"><button id="prev">上一张</button><span>${graphIndex+1} / ${data.diagrams.length}</span><button id="next">下一张</button><span class="spacer"></span><button id="fit">适应宽度</button><button id="minus">−</button><span id="zoom">100%</span><button id="plus">＋</button><a href="diagrams/${g.id}.svg" target="_blank">SVG原图</a><a href="diagrams/${g.id}.mmd" download>Mermaid源</a></div><div class="detail" id="node-detail" aria-live="polite"></div><div class="canvas" id="canvas">${svg(g)}</div><details><summary>全部节点完整注释与源码位置（${g.nodes.length} 项）</summary><table><thead><tr><th>节点</th><th>完整注释</th><th>源码</th></tr></thead><tbody>${g.nodes.map(n=>`<tr><td>${esc(n.label)}</td><td>${esc(n.note)}</td><td>${sourceLink(n.ref.split(':')[0],n.line)}</td></tr>`).join('')}</tbody></table></details></section>`;showNode(g.nodes[0]);const canvas=document.getElementById('canvas'),image=canvas.querySelector('svg'),ow=Number(image.getAttribute('width')),oh=Number(image.getAttribute('height'));function scale(){image.style.width=ow*zoom+'px';image.style.height=oh*zoom+'px';document.getElementById('zoom').textContent=Math.round(zoom*100)+'%'}document.getElementById('fit').onclick=()=>{zoom=Math.max(.2,(canvas.clientWidth-10)/ow);scale()};document.getElementById('minus').onclick=()=>{zoom=Math.max(.2,zoom-.1);scale()};document.getElementById('plus').onclick=()=>{zoom=Math.min(2,zoom+.1);scale()};document.getElementById('prev').onclick=()=>{graphIndex=(graphIndex+data.diagrams.length-1)%data.diagrams.length;zoom=1;render()};document.getElementById('next').onclick=()=>{graphIndex=(graphIndex+1)%data.diagrams.length;zoom=1;render()};canvas.querySelectorAll('[data-node]').forEach(el=>{const click=()=>showNode(g.nodes.find(n=>n.id===el.dataset.node));el.onclick=click;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();click()}}});zoom=Math.max(.2,Math.min(1,(canvas.clientWidth-10)/ow));scale();}
function searchSymbols(){const q=document.getElementById('symbol-search').value.trim().toLowerCase();symbolQuery=q;const kind=document.getElementById('symbol-kind').value;let matches=data.symbols.filter(s=>(!kind||s.kind===kind)&&(!q||(s.id+' '+s.source).toLowerCase().includes(q)));document.getElementById('symbol-count').textContent=`匹配 ${matches.length} 项，显示前 ${Math.min(200,matches.length)} 项；可用文件路径或精确函数名缩小范围。`;const list=document.getElementById('symbols-list');list.innerHTML=matches.slice(0,200).map(s=>`<button class="result" data-symbol="${esc(s.id)}"><b>${esc(s.name)}</b><small>${esc(s.file)}:${s.line}–${s.end}</small><small>${s.kind} · ${s.events.length} 结构事件 · ${s.calls.length} 调用</small></button>`).join('')||'<div class="empty">没有匹配项</div>';list.querySelectorAll('[data-symbol]').forEach(b=>b.onclick=()=>showSymbol(symbols.get(b.dataset.symbol)));}
function showSymbol(s){const panel=document.getElementById('symbol-detail');if(!panel)return;panel.innerHTML=`<section class="card"><div class="breadcrumb">${sourceLink(s.file,s.line)} · ${esc(s.kind)}</div><h2 style="font-size:19px;overflow-wrap:anywhere">${esc(s.name)}</h2><code>${esc(s.signature)}</code>${s.doc?`<p class="muted" style="white-space:pre-wrap">${esc(s.doc)}</p>`:''}<div class="callout">下面按源码行列出控制结构、条件和终止操作。完整函数源码保留所有赋值、else、finally、字段、参数及调用；静态列表不证明各路径已运行。调用目标为语法名称。</div><details open><summary>完整源代码（${s.line}–${s.end} 行）</summary><pre>${s.source.split('\n').map((line,i)=>`<span class="source-line" id="line-${s.line+i}"><span class="ln">${s.line+i}</span>${esc(line)}</span>`).join('')}</pre></details><details open><summary>条件、异常、循环与返回（${s.events.length}）</summary>${s.events.length?s.events.map(e=>`<div class="event ${['If','IfExp','BoolOp','Assert'].includes(e.type)?'branch':['Raise','ExceptHandler'].includes(e.type)?'stop':''}"><b>L${e.line} · ${e.type}</b><code>${esc(e.code)}</code></div>`).join(''):'<p class="muted">此作用域没有所列类型的结构事件。查看完整源码中的普通赋值／表达式。</p>'}</details><details><summary>全部语法调用位置（${s.calls.length}）</summary><table><thead><tr><th>行</th><th>调用目标</th></tr></thead><tbody>${s.calls.map(c=>`<tr><td>${c.line}</td><td><code>${esc(c.target)}</code></td></tr>`).join('')}</tbody></table></details></section>`;}
function symbolView(){work.innerHTML=`<section class="card"><h2>函数、条件与异常逐项查看</h2><p class="muted">src/ 和 scripts/ 的所有 Python 模块、类、函数及嵌套函数。搜索包括完整源码，可查错误码和表达式。</p><div class="toolbar"><input class="search" id="symbol-search" aria-label="搜索函数、文件或错误码" placeholder="例如 Workflow.finalize_query、FORM_VERSION_CHANGED、knowledge_fetch.py" value="${esc(symbolQuery)}"><select id="symbol-kind" aria-label="作用域类型"><option value="">全部类型</option><option value="function">函数</option><option value="class">类体</option><option value="module">模块顶层</option></select><a href="条件异常与返回明细.csv">全部事件CSV</a><a href="函数索引.csv">函数CSV</a></div><p id="symbol-count" class="small muted"></p></section><div class="results"><div id="symbols-list" class="results-list"></div><div id="symbol-detail"><section class="card"><p class="empty">选择左侧函数以查看全部细节。</p></section></div></div>`;document.getElementById('symbol-search').oninput=searchSymbols;document.getElementById('symbol-kind').onchange=searchSymbols;searchSymbols();}
function interfaces(){const modules=data.modules.filter(m=>m.routes.length||m.tools.length||m.tables.length);work.innerHTML=`<section class="card"><h2>路由、MCP工具与持久化表</h2><p class="muted">从Python语法和SQL建表字符串提取；同名govkb工具可能属于不同端口服务，必须按文件区分。动态生成的路由、表结构迁移及外部Nexent内部接口不据此推定。</p><a href="路由与MCP工具.csv">下载全部路由与工具CSV</a>${modules.map(m=>`<details><summary>${esc(m.path)} <span class="tag">${m.routes.length} routes</span><span class="tag">${m.tools.length} tools</span><span class="tag">${m.tables.length} tables</span></summary>${m.routes.length?'<h3>Route / Mount</h3>'+m.routes.map(r=>`<div class="event"><b>L${r.line}</b><code>${esc(r.code)}</code></div>`).join(''):''}${m.tools.length?'<h3>MCP工具</h3>'+m.tools.map(t=>`<div class="event"><b>L${t.line}</b><code>${esc(t.name)}(${esc(t.signature)})</code></div>`).join(''):''}${m.tables.length?'<h3>持久化表名</h3><p>'+m.tables.map(t=>`<span class="tag">${esc(t)}</span>`).join('')+'</p>':''}</details>`).join('')}</section>`;}
function fileResults(){const q=document.getElementById('file-search').value.trim().toLowerCase();fileQuery=q;const files=data.files.filter(f=>f.path.toLowerCase().includes(q));document.getElementById('file-count').textContent=`匹配 ${files.length} 项，显示前 ${Math.min(1000,files.length)} 项。`;document.getElementById('file-body').innerHTML=files.slice(0,1000).map(f=>`<tr><td>${sourceLink(f.path)}</td><td>${f.bytes.toLocaleString()}</td><td>${esc(f.extension)}</td><td><code>${esc(f.sha256||'仅元数据清单')}</code></td></tr>`).join('');}
function files(){work.innerHTML=`<section class="card"><h2>项目文件清单</h2><p class="muted">源代码、配置、部署、文档、测试定义、共享资料与历史证据。私有运行目录、密钥、模型权重、依赖镜像等排除；本清单不读取个人运行资料。</p><input id="file-search" class="search" aria-label="筛选文件" value="${esc(fileQuery)}" placeholder="按路径或扩展名筛选"><div class="toolbar"><a href="文件清单.csv">全部文件CSV</a><a href="测试定义索引.csv">测试定义CSV</a><a href="静态扫描数据.json">完整静态扫描数据</a></div><p class="small muted" id="file-count"></p><div class="files-scroll"><table><thead><tr><th>文件</th><th>Bytes</th><th>类型</th><th>源码SHA256</th></tr></thead><tbody id="file-body"></tbody></table></div><details><summary>排除目录与文件（${data.ignored.length}）</summary><table>${data.ignored.map(f=>`<tr><td>${esc(f.path)}</td><td>${esc(f.reason)}</td></tr>`).join('')}</table></details></section>`;document.getElementById('file-search').oninput=fileResults;fileResults();}
function assets(){work.innerHTML=`<section class="card"><h2>前端、启动脚本与部署文件</h2><p class="muted">${data.text_assets.length} 个文件的完整源码。下面的事件／请求、控制关键字、命令与部署项为文本定位，可能包含注释和同一行多个结构，不当作已解析的运行状态机。</p><input class="search" id="asset-search" aria-label="搜索前端或部署源码" placeholder="按文件名、URL、fetch、Start-Process或任意源码内容搜索"><a href="前端脚本与部署定位.csv">下载全部定位CSV</a></section><div class="results"><div id="asset-list" class="results-list"></div><div id="asset-detail"><section class="card">选择文件以查看源码和定位。</section></div></div>`;function list(){const q=document.getElementById('asset-search').value.toLowerCase();const selected=data.text_assets.filter(a=>(a.file+' '+a.source).toLowerCase().includes(q));document.getElementById('asset-list').innerHTML=selected.map((a,i)=>`<button class="result" data-asset="${data.text_assets.indexOf(a)}"><b>${esc(a.file)}</b><small>${a.lines} 行 · ${a.markers.length} 处文本定位</small></button>`).join('');document.querySelectorAll('[data-asset]').forEach(b=>b.onclick=()=>{const a=data.text_assets[Number(b.dataset.asset)];document.getElementById('asset-detail').innerHTML=`<section class="card"><h2 style="font-size:18px">${esc(a.file)}</h2><p class="breadcrumb">SHA256 ${esc(a.sha256)}</p><details open><summary>完整源码</summary><pre>${a.source.split('\n').map((l,i)=>`<span class="source-line"><span class="ln">${i+1}</span>${esc(l)}</span>`).join('')}</pre></details><details open><summary>文本级细节定位（${a.markers.length}）</summary>${a.markers.map(m=>`<div class="event"><b>L${m.line} · ${esc(m.type)}</b><code>${esc(m.code)}</code></div>`).join('')}</details></section>`})}document.getElementById('asset-search').oninput=list;list();}
function render(){sidebar();if(view==='overview')overview();else if(view==='diagrams')diagrams();else if(view==='symbols')symbolView();else if(view==='assets')assets();else if(view==='interfaces')interfaces();else files();}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));document.getElementById('print').onclick=()=>window.print();document.getElementById('meta').textContent=`扫描 ${data.summary.scanned_at}  |  基线 ${data.summary.git_head.slice(0,12)}＋工作区  |  全部内容可离线查看`;
render();
</script></body></html>
