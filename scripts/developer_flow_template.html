<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ICT 开发者流程图</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#20374e;font:14px/1.65 "Microsoft YaHei","Segoe UI",sans-serif}header{padding:20px 26px;background:#17344f;color:#fff}h1{font-size:23px;margin:0}header p{color:#c5d5e5;margin:3px 0}a{color:#346c9d;text-decoration:none}a:hover{text-decoration:underline}button{cursor:pointer;background:white;color:#254660;border:1px solid #cad7e2;border-radius:6px;padding:7px 12px;font:inherit}button:hover{background:#eaf2fc}nav{padding:14px;border-right:1px solid #d8e1ea;background:#fff;position:sticky;top:0;max-height:100vh;overflow:auto}nav button{text-align:left;width:100%;margin-bottom:7px;border:0;font-size:13px}nav button.active{background:#e7f0fc;color:#265c91;font-weight:600}.layout{display:grid;grid-template-columns:230px minmax(0,1fr)}main{padding:22px;min-width:0}.card{background:white;border:1px solid #d9e2ec;border-radius:10px;padding:20px;margin-bottom:16px}h2{margin:0 0 5px;font-size:22px}.muted{color:#6d7e8f}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:15px 0}.spacer{flex:1}.canvas{background:white;border:1px solid #dde5ee;overflow:auto;max-height:76vh;border-radius:8px}.canvas svg{display:block;max-width:none;flex:none}.canvas .node{cursor:pointer}.canvas .node.selected polygon,.canvas .node.selected rect,.canvas .node.selected path{stroke:#1a548b;stroke-width:3}.legend{font-size:12px;color:#677e91}.legend i{width:9px;height:9px;display:inline-block;border-radius:2px;margin:0 5px 0 12px}.detail{padding:12px 16px;border-left:3px solid #4e7faa;background:#f0f6fc;border-radius:5px;margin-bottom:16px}.detail h3{font-size:15px;margin:0 0 5px}.detail p{margin:4px 0}.source{font-size:11px;color:#647b90;overflow-wrap:anywhere}details{margin-top:10px}summary{cursor:pointer;color:#346c9d}pre{max-height:58vh;overflow:auto;border-radius:7px;background:#142d43;color:#dce6f1;font:12px/1.7 Consolas,"Microsoft YaHei",monospace;padding:14px;margin:8px 0}.line{display:block}.line b{font-weight:400;display:inline-block;width:45px;color:#8da8c1;user-select:none}.intro{padding:10px 12px;border-left:3px solid #c89439;background:#fff8e9;border-radius:4px;font-size:13px;margin:12px 0}.foot{font-size:11px;margin-top:16px;color:#6c7e90}footer{padding:12px 26px;color:#6e8091;font-size:12px}.refs{max-height:50vh;overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}td{padding:9px;border-bottom:1px solid #e1e7ef;vertical-align:top}@media(max-width:800px){.layout{display:block}nav{position:static;max-height:210px}main{padding:12px}}@media print{nav,.toolbar,.detail,footer{display:none}.layout{display:block}.canvas{max-height:none;overflow:visible}.canvas svg{width:100%!important;height:auto!important}header{background:white;color:#20374e}.card{border:0;padding:0}}
</style></head><body><header><h1>ICT · 开发者流程图</h1><p>模块与方法 → 调用时序 → 状态迁移 → 事务和数据结构</p></header><div class="layout"><nav id="nav"></nav><main id="main"></main></div><footer>按源码静态分析。未调用模型、读取私有数据库或执行业务回归；时序图的异常分支不表示同一次请求全部发生。</footer><script id="data" type="application/json">__DATA__</script><script>
'use strict';
const model=JSON.parse(document.getElementById('data').textContent),nav=document.getElementById('nav'),main=document.getElementById('main');
let selected=1,zoom=1;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showDetail(item){const s=model.sources[item.ref];document.getElementById('detail').innerHTML=`<h3>${esc(item.name)}</h3><p>${esc(item.detail)}</p><p class="source">${esc(s.file)}:${s.line}–${s.end} · ${esc(s.symbol)}</p><details><summary>展开对应函数源码</summary><pre>${s.source.split('\n').map((t,i)=>`<span class="line"><b>${i+s.line}</b>${esc(t)}</span>`).join('')}</pre></details>`;main.querySelectorAll('.node').forEach(g=>g.classList.toggle('selected',g.id===item.dom_id));}
function render(){const g=model.graphs[selected];nav.innerHTML='<p class="muted" style="font-size:12px">建议先读02咨询时序，再按需定位其他图。</p>'+model.graphs.map((x,i)=>`<button data-index="${i}" class="${i===selected?'active':''}">${esc(x.title)}</button>`).join('')+'<p class="foot">蓝：函数<br>黄：校验／事务<br>绿：存储<br>红：异常<br><br>点图中节点或时序消息，查看完整说明与源代码。</p><p><a href="开发者流程说明.md">全部图与说明</a></p><p><a href="../项目流程图详解-2026-10-18/index.html">原业务总览／函数索引</a></p>';nav.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.index);render()});
main.innerHTML=`<section class="card"><h2>${esc(g.title)}</h2><p class="muted">${esc(g.intent)}</p><div class="toolbar"><button id="prev">上一张</button><span>${selected+1} / ${model.graphs.length}</span><button id="next">下一张</button><span class="spacer"></span><button id="fit">适应宽度</button><button id="actual">100%</button><button id="minus">−</button><span id="zoom"></span><button id="plus">＋</button><a href="diagrams/${g.id}.svg" target="_blank">单独打开SVG</a>${g.kind==='flow'?`<a href="diagrams/${g.id}.dot" download>DOT源文件</a>`:''}</div><div class="detail" id="detail" aria-live="polite"></div><div class="canvas" id="canvas">${g.svg}</div><details><summary>全部节点／消息与源码位置</summary><div class="refs"><table>${g.nodes.map((n,i)=>`<tr><td><button data-ref="${i}">${esc(n.name)}</button></td><td>${esc(n.detail)}</td><td class="source">${esc(model.sources[n.ref].file)}:${model.sources[n.ref].line}</td></tr>`).join('')}</table></div></details><p class="foot">扫描时间 ${esc(model.generated_at)} · 方法与行号来自实际源码。图可缩放，完整参数和普通赋值保留在源码详情。</p></section>`;
const canvas=document.getElementById('canvas'),svg=canvas.querySelector('svg');let box=svg.getAttribute('viewBox').split(/\s+/).map(Number),w=box[2],h=box[3];function scale(){svg.style.width=w*zoom+'px';svg.style.height=h*zoom+'px';document.getElementById('zoom').textContent=Math.round(zoom*100)+'%'}function fit(){zoom=Math.min(1,Math.max(.15,(canvas.clientWidth-8)/w));scale()}document.getElementById('fit').onclick=fit;document.getElementById('actual').onclick=()=>{zoom=1;scale()};document.getElementById('minus').onclick=()=>{zoom=Math.max(.1,zoom-.1);scale()};document.getElementById('plus').onclick=()=>{zoom=Math.min(3,zoom+.1);scale()};document.getElementById('prev').onclick=()=>{selected=(selected+model.graphs.length-1)%model.graphs.length;render()};document.getElementById('next').onclick=()=>{selected=(selected+1)%model.graphs.length;render()};
for(const item of g.nodes){const el=document.getElementById(item.dom_id);if(!el)continue;el.setAttribute('tabindex','0');el.setAttribute('role','button');el.onclick=e=>{e.preventDefault();showDetail(item)};el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showDetail(item)}}}main.querySelectorAll('[data-ref]').forEach(b=>b.onclick=()=>showDetail(g.nodes[Number(b.dataset.ref)]));showDetail(g.nodes[0]);fit();}
render();
</script></body></html>
