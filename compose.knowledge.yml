services:
  govkb-maintenance:
    image: ict-gov-knowledge
    build:
      context: .
      dockerfile: Dockerfile.knowledge
    container_name: govkb-maintenance
    restart: unless-stopped
    environment:
      PYTHONPATH: /app/src
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
    ports: ["127.0.0.1:8775:8775"]
    volumes:
      - ./src:/app/src:ro
      - ./.runtime/knowledge:/runtime
    networks: [nexent]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8775/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  govkb-demo:
    image: ict-gov-knowledge
    profiles: [demo]
    container_name: govkb-demo
    restart: unless-stopped
    environment:
      PYTHONPATH: /app/src
      GOVKB_SYNTHETIC_REPLAY: "1"
    ports: ["127.0.0.1:8778:8775"]
    volumes:
      - ./src:/app/src:ro
      - ./.runtime/knowledge-demo:/runtime
    networks: [nexent]
networks:
  nexent:
    external: true
    name: nexent_network
