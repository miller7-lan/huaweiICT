[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gov-blank-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp==1.26.0", "httpx==0.28.1", "PyYAML==6.0.3", "pydantic>=2.12,<3", "starlette==1.7.0", "uvicorn==0.54.0"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
knowledge = ["pypdf==6.20.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gov_mcp = ["*.html", "*.js", "*.css", "knowledge/*.html", "decision/*.html", "decision/*.js", "decision/*.css", "knowledge_ocr_windows.ps1", "knowledge_startup_windows.ps1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
