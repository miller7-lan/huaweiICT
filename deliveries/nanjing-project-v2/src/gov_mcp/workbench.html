<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>政务协作 · M1 工作台</title>
<style>
:root{color-scheme:light;font-family:"Microsoft YaHei",system-ui,sans-serif;color:#1b3041;background:#f3f6f9}*{box-sizing:border-box}body{margin:0}header{background:#16394e;color:white;padding:22px 36px;display:flex;align-items:center;justify-content:space-between}header strong{font-size:21px}main{max-width:1080px;margin:32px auto;padding:0 24px}.card{background:white;border:1px solid #d9e2e9;border-radius:12px;padding:28px;margin-bottom:20px}.sub{color:#5c7181;line-height:1.8}nav{display:flex;gap:12px;margin:20px 0}button{background:#165b78;color:white;border:0;border-radius:6px;padding:12px 20px;font:inherit;cursor:pointer}button:disabled{background:#b0bcc4;cursor:default}input{font:inherit;padding:12px;border:1px solid #b6c5d0;border-radius:6px;margin:8px 0 18px;display:block;width:100%;max-width:420px}label{display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.metric{padding:20px;background:#f2f7fa;border-radius:8px}.metric b{display:block;font-size:30px;margin:12px 0}.empty{padding:34px;text-align:center;background:#f8fafc;border:1px dashed #cedce5;border-radius:8px}.status{padding:15px;border-left:4px solid #b47724;background:#fff7e8;white-space:pre-wrap;line-height:1.8}.hidden{display:none}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;color:#476070}.badge{font-size:13px;background:#2c546a;border-radius:20px;padding:7px 13px}.tools{display:flex;gap:12px;flex-wrap:wrap}.error{color:#a53323}[type=checkbox]{width:auto;display:inline;margin-right:8px}@media(max-width:650px){.grid{grid-template-columns:1fr}header{padding:20px}nav{flex-wrap:wrap}}
</style></head><body><header><strong>政务多智能体协作系统</strong><span class="badge">M1 空白验收 · 隔离环境</span></header>
<main><section id="login" class="card"><h1>登录工作台</h1><p class="sub">使用本机平台账号登录。业务角色由登录会话和受控映射核定。</p><form id="login-form"><label for="email">邮箱</label><input id="email" type="email" required autocomplete="username"><label for="password">密码</label><input id="password" type="password" required autocomplete="current-password"><button>登录</button></form><p id="login-error" class="error" role="alert"></p></section>
<section id="app" class="hidden"><div class="card"><h1>事项协作工作台</h1><p id="identity" class="sub"></p><nav><button id="staff-nav">工作人员工作台</button><button id="knowledge-nav">知识状态</button><button id="refresh">刷新状态</button><button id="logout">退出登录</button></nav><div id="environment" class="status" role="status"></div></div>
<section id="staff" class="card hidden"><h2>工作人员事项与待办</h2><div id="staff-denied" class="status hidden" role="alert"></div><div id="staff-content" class="hidden"><div class="grid"><div class="metric">事项<b id="cases">0</b></div><div class="metric">材料<b id="materials">0</b></div><div class="metric">待办<b id="pending">0</b></div></div><p class="empty">当前没有事项、材料或待办。缺少核验前提，暂不能进行材料核验。</p><div id="prerequisites" class="status"></div></div></section>
<section id="knowledge" class="card hidden"><h2>知识与更新状态</h2><p class="sub">当前没有业务资料。空更新仅表示本次无可处理输入，不代表已检查外部政策。</p><div class="tools"><button id="graph">查询图谱</button><button id="prepare">准备空更新</button><button id="publish">检查发布前提</button></div><label><input id="confirm" type="checkbox">确认检查当前发布前提</label><p id="tool-result" class="status" role="status">等待操作</p><details><summary>查看真实工具结果</summary><pre id="raw"></pre></details></section>
</section></main><script>
const $=id=>document.getElementById(id);let env=null;
const descriptions={ENVIRONMENT_READY:'连接已配置，业务库为空。',ROLE_NOT_CONFIGURED:'角色未配置，请联系管理员核实。当前操作已停止。',CONNECTION_NOT_CONFIGURED:'连接未配置。当前操作已停止。',CONFIG_OR_STORAGE_UNAVAILABLE:'配置或存储不可用。当前操作已停止。',CONNECTION_OR_TOOL_UNAVAILABLE:'工具连接或执行不可用。当前操作已停止。',FORBIDDEN:'当前账号没有此项权限，操作已停止。',NO_GRAPH:'当前图谱为空，无节点、无关系。',NO_CHANGES:'本次无可处理输入，未创建候选或知识版本。未检查外部政策。',MISSING_CASE_AND_MATERIALS:'缺少事项、材料、证据，核验已停止。',PUBLISH_PREREQUISITES_MISSING:'缺少候选变更或确认前提，发布已阻断。',TOOL_TIMEOUT:'工具超时，有限重试后已停止。'};
function message(v){return `${v.status} / ${v.message_code}\n${descriptions[v.message_code]||'操作已停止，请核对真实结果。'}`}
async function api(path,body){const r=await fetch('/api/'+path,{method:body===undefined?'GET':'POST',headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const v=await r.json();if(r.status===401){$('app').classList.add('hidden');$('login').classList.remove('hidden')}return v}
async function refresh(){env=await api('state');if(env.message_code==='LOGIN_REQUIRED')return;$('login').classList.add('hidden');$('app').classList.remove('hidden');const role=env.data?.role;$('identity').textContent='已核定业务角色：'+({citizen:'群众',staff:'工作人员'}[role]||(env.status==='ERROR'?'暂无法核实':'未配置'));$('environment').textContent=message(env);$('staff').classList.add('hidden');if(role==='staff'&&env.status==='OK')await staff()}
async function staff(){$('staff').classList.remove('hidden');$('knowledge').classList.add('hidden');const v=env?.status==='OK'?await api('workbench'):env;const allowed=v.message_code==='MISSING_CASE_AND_MATERIALS'&&v.data?.role==='staff';$('staff-content').classList.toggle('hidden',!allowed);$('staff-denied').classList.toggle('hidden',allowed);$('staff-denied').textContent=message(v);if(allowed){$('cases').textContent=env.data?.counts?.cases??'—';$('materials').textContent=env.data?.counts?.materials??'—';$('pending').textContent=v.data.pending_count;$('prerequisites').textContent=message(v)}}
async function operation(name,body){const v=env?.status==='OK'?await api('tools/'+name,body):env;$('tool-result').textContent=message(v);$('raw').textContent=JSON.stringify(v,null,2)}
$('login-form').onsubmit=async e=>{e.preventDefault();const v=await api('login',{email:$('email').value,password:$('password').value});$('password').value='';if(v.status==='OK'){await refresh()}else{$('login-error').textContent='登录失败，请核对账号。'}};
$('staff-nav').onclick=staff;$('refresh').onclick=refresh;$('knowledge-nav').onclick=()=>{$('staff').classList.add('hidden');$('knowledge').classList.remove('hidden')};$('graph').onclick=()=>operation('query_knowledge_graph',{});$('prepare').onclick=()=>operation('prepare_update',{inputs:[]});$('publish').onclick=()=>operation('publish_update',{confirmed:$('confirm').checked});$('logout').onclick=async()=>{await api('logout',{});location.reload()};refresh().catch(()=>$('login-error').textContent='服务暂不可用，请重试。');
</script></body></html>
