[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gov-blank-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp==1.26.0", "httpx==0.28.1", "PyYAML==6.0.3"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
knowledge = ["pypdf==6.20.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gov_mcp = ["*.html", "knowledge_ocr_windows.ps1", "knowledge_startup_windows.ps1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
