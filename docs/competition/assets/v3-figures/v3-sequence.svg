<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"><defs><marker id="a3b6ea5" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#3b6ea5"/></marker><marker id="ab5651d" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b5651d"/></marker><marker id="aa33a3a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#a33a3a"/></marker><marker id="a2e7d4f" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2e7d4f"/></marker></defs><rect width="1000" height="620" fill="#fff"/><text x="24" y="36" font-size="18" font-weight="bold" fill="#1d2b3a" font-family="WenQuanYi Zen Hei, Microsoft YaHei, PingFang SC, sans-serif">V3 在 Nexent 中的调用顺序</text><rect x="25" y="60" width="250" height="40" rx="8" fill="#eef4fb" stroke="#3b6ea5" stroke-width="1.5"/><text x="150.0" y="80.0" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="bold" fill="#1d2b3a" font-family="WenQuanYi Zen Hei, Microsoft YaHei, PingFang SC, sans-serif">用户 / Nexent 调试界面</text><path d="M150,100 L150,560" stroke="#9aa7b5" stroke-width="1.2" stroke-dasharray="4,4"/><rect x="345" y="60" width="250" height="40" rx="8" fill="#eef4fb" stroke="#3b6ea5" stroke-width="1.5"/><text x="470.0" y="80.0" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="bold" fill="#1d2b3a" font-family="WenQuanYi Zen Hei, Microsoft YaHei, PingFang SC, sans-serif">41 号草稿 Agent（模型）</text><path d="M470,100 L470,560" stroke="#9aa7b5" stroke-width="1.2" stroke-dasharray="4,4"/><rect x="695" y="60" width="250" height="40" rx="8" fill="#eef4fb" stroke="#3b6ea5" stroke-width="1.5"/><text x="820.0" y="80.0" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="bold" fill="#1d2b3a" font-family="WenQuanYi Zen Hei, Microsoft YaHei, PingFang SC, sans-serif">MCP 服务 govkb_frozen_flow</text><path d="M820,100 L820,560" stroke="#9aa7b5" stroke-width="1.2" stroke-dasharray="4,4"/><path d="M150,140 L470,140" stroke="#3b6ea5" stroke-width="1.6" fill="none" marker-end="url(#a3b6ea5)"/><text x="310.0" y="132" text-anchor="middle" font-size="12.5" fill="#3b6ea5" font-family="WenQuanYi Zen Hei, Microsoft YaHei, PingFang SC, sans-serif">问题</text><path d="M470,185 L820,185" stroke="#3b6ea5" stroke-width="1.6" fill="none" marker-end="url(#a3b6ea5)"/><text x="645.0" y="177" text-anchor="middle" font-size="12.5" fill="#3b6ea5" font-family="WenQuanYi Zen Hei, Microsoft YaHei, PingFang SC, sans-serif">govkb_flow_open(question)</text><rect x="700" y="198" width="240" height="34" rx="6" fill="#f4f6f8" stroke="#9aa7b5"/><text x="820" y="216" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1d2b3a" font-family="WenQuanYi Zen Hei, Microsoft YaHei, PingFang SC, sans-serif">范围门 → 检索 → 建任务</text><path d="M820,265 L470,265" stroke="#3b6ea5" stroke-width="1.6" fill="none" marker-end="url(#a3b6ea5)" stroke-dasharray="5,4"/><text x="645.0" y="257" text-anchor="middle" font-size="12.5" fill="#3b6ea5" font-family="WenQuanYi Zen Hei, Microsoft YaHei, PingFang SC, sans-serif">task_id、证据、作答规则、表格列对照</text><path d="M470,310 L820,310" stroke="#3b6ea5" stroke-width="1.6" fill="none" marker-end="url(#a3b6ea5)"/><text x="645.0" y="302" text-anchor="middle" font-size="12.5" fill="#3b6ea5" font-family="WenQuanYi Zen Hei, Microsoft YaHei, PingFang SC, sans-serif">govkb_flow_submit(task_id, 草稿)</text><rect x="700" y="323" width="240" height="34" rx="6" fill="#f4f6f8" stroke="#9aa7b5"/><text x="820" y="341" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1d2b3a" font-family="WenQuanYi Zen Hei, Microsoft YaHei, PingFang SC, sans-serif">计数写盘 → 逐条核验</text><rect x="330" y="372" width="630" height="96" fill="none" stroke="#b5651d" stroke-dasharray="3,3"/><text x="952" y="460" text-anchor="end" font-size="11.5" fill="#b5651d" font-family="WenQuanYi Zen Hei, Microsoft YaHei, PingFang SC, sans-serif">可出现至多两次；每任务最多 3 份草稿</text><path d="M820,400 L470,400" stroke="#b5651d" stroke-width="1.6" fill="none" marker-end="url(#ab5651d)" stroke-dasharray="5,4"/><text x="645.0" y="392" text-anchor="middle" font-size="12.5" fill="#b5651d" font-family="WenQuanYi Zen Hei, Microsoft YaHei, PingFang SC, sans-serif">action=revise：失败码，或新增证据</text><path d="M470,440 L820,440" stroke="#b5651d" stroke-width="1.6" fill="none" marker-end="url(#ab5651d)"/><text x="645.0" y="432" text-anchor="middle" font-size="12.5" fill="#b5651d" font-family="WenQuanYi Zen Hei, Microsoft YaHei, PingFang SC, sans-serif">govkb_flow_submit(task_id, 修改稿)</text><path d="M820,500 L470,500" stroke="#2e7d4f" stroke-width="1.6" fill="none" marker-end="url(#a2e7d4f)" stroke-dasharray="5,4"/><text x="645.0" y="492" text-anchor="middle" font-size="12.5" fill="#2e7d4f" font-family="WenQuanYi Zen Hei, Microsoft YaHei, PingFang SC, sans-serif">action=final：答复 / 部分答复 / 停止，及再核验结果</text><path d="M470,540 L150,540" stroke="#2e7d4f" stroke-width="1.6" fill="none" marker-end="url(#a2e7d4f)" stroke-dasharray="5,4"/><text x="310.0" y="532" text-anchor="middle" font-size="12.5" fill="#2e7d4f" font-family="WenQuanYi Zen Hei, Microsoft YaHei, PingFang SC, sans-serif">仅依据 final 组织答复</text><text x="24" y="586" font-size="12" fill="#6b7785" font-family="WenQuanYi Zen Hei, Microsoft YaHei, PingFang SC, sans-serif">依据 2026-11-15 三次原生运行的工具顺序整理（示意图，非平台截图）。</text><text x="24" y="604" font-size="12" fill="#6b7785" font-family="WenQuanYi Zen Hei, Microsoft YaHei, PingFang SC, sans-serif">范围门命中时只调用 govkb_flow_open，不建任务。</text></svg>