" font-size="24" fill="#1F3F66">逐条核验</text><polyline points="540,420 575,420 575,590 606,590" fill="none" stroke="#4A5568" stroke-width="3" marker-end="url(#a)"/><polyline points="880,590 936,590" fill="none" stroke="#4A5568" stroke-width="3" marker-end="url(#a)"/><polyline points="1240,590 1296,590" fill="none" stroke="#4A5568" stroke-width="3" marker-end="url(#a)"/><rect x="1300" y="720" width="270" height="110" rx="12" fill="#FDF3E6" stroke="#B8691F" stroke-width="2.6"/><text x="1435.0" y="767.78" text-anchor="middle" font-size="23" fill="#7A4512">修复一次 / 补查一次</text><text x="1435.0" y="798.78" text-anchor="middle" font-size="23" fill="#7A4512">仍未过则逐条取舍</text><polyline points="1435,650 1435,716" fill="none" stroke="#B8691F" stroke-width="3" marker-end="url(#o)"/><text x="1447" y="694" font-size="23" fill="#B8691F" text-anchor="start">未通过</text><polyline points="1300,775 1090,775 1090,654" fill="none" stroke="#B8691F" stroke-width="3" stroke-dasharray="11 8" marker-end="url(#o)"/><text x="1080" y="812" font-size="23" fill="#B8691F" text-anchor="end">改写或补证据后重交</text><rect x="1660" y="190" width="300" height="120" rx="12" fill="#EAF5EC" stroke="#2E7D4A" stroke-width="2.6"/><text x="1810.0" y="242.5" text-anchor="middle" font-size="25" fill="#1E5C34">带引用的结论</text><text x="1810.0" y="275.5" text-anchor="middle" font-size="25" fill="#1E5C34">＋未知项</text><rect x="1660" y="470" width="300" height="150" rx="12" fill="#EAF5EC" stroke="#2E7D4A" stroke-width="2.6"/><text x="1810.0" y="521.64" text-anchor="middle" font-size="24" fill="#1E5C34">完整答复 / 留缺口</text><text x="1810.0" y="553.64" text-anchor="middle" font-size="24" fill="#1E5C34">/ 部分答复</text><text x="1810.0" y="585.64" text-anchor="middle" font-size="24" fill="#1E5C34">附原文与定位</text><rect x="1660" y="690" width="300" height="140" rx="12" fill="#FBECEC" stroke="#A63C3C" stroke-width="2.6"/><text x="1810.0" y="752.5" text-anchor="middle" font-size="25" fill="#8E2B2B">停止作答</text><text x="1810.0" y="785.5" text-anchor="middl