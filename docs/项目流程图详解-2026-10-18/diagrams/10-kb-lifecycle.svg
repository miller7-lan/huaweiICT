><text class="edgeLabel" x="225.0" y="772.0" font-size="11" text-anchor="middle" fill="#496176">reviewed</text><path d="M 225.0 930 C 225.0 965.0, 225.0 965.0, 225.0 1000" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="225.0" y="958.0" font-size="11" text-anchor="middle" fill="#496176">版本绑定</text><path d="M 225.0 1116 C 225.0 1151.0, 225.0 1151.0, 225.0 1186" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="225.0" y="1144.0" font-size="11" text-anchor="middle" fill="#496176">核验达标</text><path d="M 225.0 1302 C 225.0 1337.0, 225.0 1337.0, 225.0 1372" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="225.0" y="1330.0" font-size="11" text-anchor="middle" fill="#496176">显式需要时</text><g class="node" data-node="raw" tabindex="0"><title>内容寻址归档原件：SHA256命名、排他写入；已有原件须哈希匹配；保存原文定位、分类及全部选段。；源码：src/gov_mcp/knowledge/registry.py:KnowledgeStore.ingest</title><rect x="60" y="70" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="97" font-size="15" font-weight="700" fill="#183049">内容寻址归档原件</text><text x="78" y="146" font-size="11" fill="#486075">SHA256命名、排他写入；已有原件须哈希匹配；保存</text><text x="78" y="163" font-size="11" fill="#486075">原文定位、分类及全部选段。</text></g><g class="node" data-node="dedup" tabindex="0"><title>正文／元数据／观察信号去重：相同正文且观察符合可保留修订；旧文本回归也按观察先后保留；元数据纠正新增修订。；源码：src/gov_mcp/knowledge/registry.py:KnowledgeStore.ingest</title><rect x="60" y="256" width="330" height="116" rx="12" fill="#fff4d8" stroke="#a56b13"/><text x="78" y="283" font-size="15" font-weight="700" fill="#183049">正文／元数据／观察信号去重</text><text x="78" y="332" font-size="11" fill="#486075">相同正文且观察符合可保留修订；旧文本回归也按观</text><text x="78" y="349" font-size="11" fill="#486075">察先后保留；元数据纠正新增修订。</text></g><g class="node" data-node="pending" tabindex="0"><title>pending_review：新增来源日期置未知；范围、usage_basis、冲突、生效证据须复核；采集成功不增加批准数。；源码：src/gov_mcp/knowledge/registry.py:KnowledgeStore.review</title><rect x="60" y="442" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="469" font-size="15" font-weight="700" fill="#183049">pending_review</text><text x="78" y="518" font-size="11" fill="#486075">新增来源日期置未知；范围、usage_basis、冲突、</text><text x="78" y="535" font-size="11" fill="#486075">生效证据须复核；采集成功不增加批准数。</text></g><g class="node" data-node="review" tabindex="0"><title>人工review并绑定digest：confirmed=true＋具名reviewer；校验原件／选段指纹和reviewed_start；范围必须已核。；源码：src/gov_mcp/knowledge/registry.py:KnowledgeStore.review</title><rect x="60" y="628" width="330" height="116" rx="12" fill="#fff4d8" stroke="#a56b13"/><text x="78" y="655" font-size="15" font-weight="700" fill="#183049">人工review并绑定digest</text><text x="78" y="704" font-size="11" fill="#486075">confirmed=true＋具名reviewer；校验原件／选段指</text><text x="78" y="721" font-size="11" fill="#486075">纹和reviewed_start；范围必须已核。</text></g><g class="node" data-node="exclude" tabindex="0"><title>exclude／reopen／amend：排除须具名、理由和确认并生成处置修订；重开恢复待审且清除日期；观察证据不可改写。；源码：src/gov_mcp/knowledge/registry.py:KnowledgeStore.exclude</title><rect x="500" y="628" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="518" y="655" font-size="15" font-weight="700" fill="#183049">exclude／reopen／amend</text><text x="518" y="704" font-size="11" fill="#486075">排除须具名、理由和确认并生成处置修订；重开恢复</text><text x="518" y="721" font-size="11" fill="#486075">待审且清除日期；观察证据不可改写。</text></g><g class="node" data-node="candidate" tabindex="0"><title>按地区＋事项建立candidate：未分类潜在相关发现阻止生成；最新修订须复核或有有效排除；版本绑定members及parent。；源码：src/gov_mcp/knowledge/registry.py:KnowledgeStore.candidate</title><rect x="60" y="814" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="841" font-size="15" font-weight="700" fill="#183049">按地区＋事项建立candidate</text><text x="78" y="890" font-size="11" fill="#486075">未分类潜在相关发现阻止生成；最新修订须复核或有</text><text x="78" y="907" font-size="11" fill="#486075">有效排除；版本绑定members及parent。</text></g><g class="node" data-node="quality" tabindex="0"><title>绑定独立评测与发布质量门：business策略：至少30例、Recall@5≥0.9、claim support=1.0、来源新鲜；attributed_v2另校核题集来源与独立性。；源码：src/gov_mcp/knowledge_quality.py:validate_report</title><rect x="60" y="1000" width="330" height="116" rx="12" fill="#fff4d8" stroke="#a56b13"/><text x="78" y="1027" font-size="15" font-weight="700" fill="#183049">绑定独立评测与发布质量门</text><text x="78" y="1076" font-size="11" fill="#486075">business策略：至少30例、Recall@5≥0.9、claim s</text><text x="78" y="1093" font-size="11" fill="#486075">upport=1.0、来源新鲜；attributed_v2另校核题集…</text></g><g class="node" data-node="pub" tabindex="0"><title>明确维护人确认后publish：必须仍为candidate、parent等于当前头、范围成员未变且质量通过；事务内切换heads。；源码：src/gov_mcp/knowledge/registry.py:KnowledgeStore.publish</title><rect x="60" y="1186" width="330" height="116" rx="12" fill="#fff4d8" stroke="#a56b13"/><text x="78" y="1213" font-size="15" font-weight="700" fill="#183049">明确维护人确认后publish</text><text x="78" y="1262" font-size="11" fill="#486075">必须仍为candidate、parent等于当前头、范围成员</text><text x="78" y="1279" font-size="11" fill="#486075">未变且质量通过；事务内切换heads。</text></g><g class="node" data-node="back" tabindex="0"><title>rollback历史published版本：显式维护人确认；重新验证全部成员；保留历史原件与引用。；源码：src/gov_mcp/knowledge/registry.py:KnowledgeStore.rollback</title><rect x="60" y="1372" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="1399" font-size="15" font-weight="700" fill="#183049">rollback历史published版本</text><text x="78" y="1448" font-size="11" fill="#486075">显式维护人确认；重新验证全部成员；保留历史原件</text><text x="78" y="1465" font-size="11" fill="#486075">与引用。</text></g></svg>