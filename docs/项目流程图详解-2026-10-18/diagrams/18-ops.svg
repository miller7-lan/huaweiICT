up.py</title><rect x="60" y="1186" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="1213" font-size="15" font-weight="700" fill="#183049">OS恢复与Docker分别登记</text><text x="78" y="1262" font-size="11" fill="#486075">Docker unless-stopped；Windows任务必须独立注册</text><text x="78" y="1279" font-size="11" fill="#486075">及核查，不能由进程心跳推出系统重启可恢复。</text></g><g class="node" data-node="stop" tabindex="0"><title>本轮心跳试验已结束：文档记录短周期南京采集：正文未变、无新修订／发布；测试源暂停、无永久轮询；不能推断常驻真实更新已启用。；源码：docs/赛题3资料/心跳与主动知识更新测试-2026-10-18.md</title><rect x="500" y="1186" width="330" height="116" rx="12" fill="#ffeded" stroke="#b74343"/><text x="518" y="1213" font-size="15" font-weight="700" fill="#183049">本轮心跳试验已结束</text><text x="518" y="1262" font-size="11" fill="#486075">文档记录短周期南京采集：正文未变、无新修订／发</text><text x="518" y="1279" font-size="11" fill="#486075">布；测试源暂停、无永久轮询；不能推断常驻真实更…</text></g></svg>