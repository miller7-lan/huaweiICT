<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="07 · 8780模拟更新、冲突暂停与候选" viewBox="0 0 800 1588" width="800" height="1588"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#72859b"/></marker></defs><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif}.node{cursor:pointer}.node:hover rect{stroke-width:3}.edgeLabel{paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}</style><rect width="800" height="1588" fill="#fff"/><text x="60" y="32" fill="#183049" font-size="18" font-weight="700">07 · 8780模拟更新、冲突暂停与候选</text><path d="M 225.0 186 C 225.0 221.0, 225.0 221.0, 225.0 256" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="225.0" y="214.0" font-size="11" text-anchor="middle" fill="#496176">获租约且允许</text><path d="M 225.0 372 C 225.0 407.0, 225.0 407.0, 225.0 442" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="225.0" y="400.0" font-size="11" text-anchor="middle" fill="#496176">空余本轮额度</text><path d="M 225.0 558 C 225.0 593.0, 225.0 593.0, 225.0 628" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="225.0" y="586.0" font-size="11" text-anchor="middle" fill="#496176">指纹改变</text><path d="M 225.0 744 C 225.0 779.0, 225.0 779.0, 225.0 814" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="225.0" y="772.0" font-size="11" text-anchor="middle" fill="#496176">保存包</text><path d="M 225.0 930 C 225.0 965.0, 225.0 965.0, 225.0 1000" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="225.0" y="958.0" font-size="11" text-anchor="middle" fill="#496176">成功</text><path d="M 225.0 1116 C 225.0 1151.0, 225.0 1151.0, 225.0 1186" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="225.0" y="1144.0" font-size="11" text-anchor="middle" fill="#496176">核验完成</text><path d="M 225.0 1302 C 225.0 1337.0, 225.0 1337.0, 225.0 1372" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="225.0" y="1330.0" font-size="11" text-anchor="middle" fill="#496176">写候选</text><path d="M 390 1430.0 C 444 1430.0, 444 128.0, 390 128.0" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="434" y="779.0" font-size="11" text-anchor="middle" fill="#496176">下一轮仅恢复未完成包</text><g class="node" data-node="beat" tabindex="0"><title>heartbeat记录存活：默认paused；force可单轮；claim租约120秒、总预算600秒；已有轮占用则already_running。；源码：src/gov_mcp/decision/workflow.py:Workflow.heartbeat</title><rect x="60" y="70" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="97" font-size="15" font-weight="700" fill="#183049">heartbeat记录存活</text><text x="78" y="146" font-size="11" fill="#486075">默认paused；force可单轮；claim租约120秒、总预</text><text x="78" y="163" font-size="11" fill="#486075">算600秒；已有轮占用则already_running。</text></g><g class="node" data-node="resume" tabindex="0"><title>优先恢复processing阶段：每轮至多处理3个包／来源；只处理enabled且approved的到期来源。；源码：src/gov_mcp/decision/workflow.py:Workflow.heartbeat</title><rect x="60" y="256" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="283" font-size="15" font-weight="700" fill="#183049">优先恢复processing阶段</text><text x="78" y="332" font-size="11" fill="#486075">每轮至多处理3个包／来源；只处理enabled且approv</text><text x="78" y="349" font-size="11" fill="#486075">ed的到期来源。</text></g><g class="node" data-node="compare" tabindex="0"><title>读取模拟来源并计算指纹：baseline / changed / unavailable / noise；同指纹标unchanged；读取失败只记来源失败。；源码：src/gov_mcp/decision/workflow.py:Workflow._check</title><rect x="60" y="442" width="330" height="116" rx="12" fill="#fff4d8" stroke="#a56b13"/><text x="78" y="469" font-size="15" font-weight="700" fill="#183049">读取模拟来源并计算指纹</text><text x="78" y="518" font-size="11" fill="#486075">baseline / changed / unavailable / noise；同指</text><text x="78" y="535" font-size="11" fill="#486075">纹标unchanged；读取失败只记来源失败。</text></g><g class="node" data-node="change" tabindex="0"><title>生成包并立即暂停受影响要求：新generation；旧未发布包superseded；候选严格绑定现有要求、动作及原文；写block与audit_gate。；源码：src/gov_mcp/decision/workflow.py:Workflow._check</title><rect x="60" y="628" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="655" font-size="15" font-weight="700" fill="#183049">生成包并立即暂停受影响要求</text><text x="78" y="704" font-size="11" fill="#486075">新generation；旧未发布包superseded；候选严格绑</text><text x="78" y="721" font-size="11" fill="#486075">定现有要求、动作及原文；写block与audit_gate。</text></g><g class="node" data-node="classify" tabindex="0"><title>discovered → classified：更新主控规划＋Jev合同回放分类；明确标synthetic_contract_replay_not_jev。；源码：src/gov_mcp/decision/workflow.py:Workflow._process</title><rect x="60" y="814" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="841" font-size="15" font-weight="700" fill="#183049">discovered → classified</text><text x="78" y="890" font-size="11" fill="#486075">更新主控规划＋Jev合同回放分类；明确标synthetic</text><text x="78" y="907" font-size="11" fill="#486075">_contract_replay_not_jev。</text></g><g class="node" data-node="extract" tabindex="0"><title>classified → extracted → validated：fixture提取器＋结构检查＋核验角色；冲突清单；原文精确匹配信号不代表真实Jev效果。；源码：src/gov_mcp/decision/workflow.py:Workflow._extract_packet</title><rect x="60" y="1000" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="1027" font-size="15" font-weight="700" fill="#183049">classified → extracted → validated</text><text x="78" y="1076" font-size="11" fill="#486075">fixture提取器＋结构检查＋核验角色；冲突清单；</text><text x="78" y="1093" font-size="11" fill="#486075">原文精确匹配信号不代表真实Jev效果。</text></g><g class="node" data-node="docs" tabindex="0"><title>文档及本地稀疏索引更新：检索索引使用汉字双字组／拉丁词归一化余弦；不是稠密向量；来源guard须仍有效。；源码：src/gov_mcp/decision/workflow.py:Workflow._process</title><rect x="60" y="1186" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="1213" font-size="15" font-weight="700" fill="#183049">文档及本地稀疏索引更新</text><text x="78" y="1262" font-size="11" fill="#486075">检索索引使用汉字双字组／拉丁词归一化余弦；不是</text><text x="78" y="1279" font-size="11" fill="#486075">稠密向量；来源guard须仍有效。</text></g><g class="node" data-node="wait" tabindex="0"><title>awaiting_review：业务规则不自动发布；候选保留引用；人工期限带时区；失败保留阶段供后续恢复。；源码：src/gov_mcp/decision/workflow.py:Workflow.deadline</title><rect x="60" y="1372" width="330" height="116" rx="12" fill="#fff4d8" stroke="#a56b13"/><text x="78" y="1399" font-size="15" font-weight="700" fill="#183049">awaiting_review</text><text x="78" y="1448" font-size="11" fill="#486075">业务规则不自动发布；候选保留引用；人工期限带时</text><text x="78" y="1465" font-size="11" fill="#486075">区；失败保留阶段供后续恢复。</text></g></svg>