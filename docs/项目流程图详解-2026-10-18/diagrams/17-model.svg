<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="17 · 模型开关、翻译、分类与Jev校验" viewBox="0 0 1000 1402" width="1000" height="1402"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#72859b"/></marker></defs><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif}.node{cursor:pointer}.node:hover rect{stroke-width:3}.edgeLabel{paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}</style><rect width="1000" height="1402" fill="#fff"/><text x="60" y="32" fill="#183049" font-size="18" font-weight="700">17 · 模型开关、翻译、分类与Jev校验</text><path d="M 225.0 186 C 225.0 221.0, 225.0 221.0, 225.0 256" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="225.0" y="214.0" font-size="11" text-anchor="middle" fill="#496176">明确真实调用且已启用</text><path d="M 225.0 372 C 225.0 407.0, 225.0 407.0, 225.0 442" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="225.0" y="400.0" font-size="11" text-anchor="middle" fill="#496176">标签通过</text><path d="M 225.0 558 C 225.0 593.0, 225.0 593.0, 225.0 628" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="225.0" y="586.0" font-size="11" text-anchor="middle" fill="#496176">需要英译</text><path d="M 225.0 744 C 225.0 779.0, 225.0 779.0, 225.0 814" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="225.0" y="772.0" font-size="11" text-anchor="middle" fill="#496176">译文</text><path d="M 225.0 930 C 225.0 965.0, 225.0 965.0, 225.0 1000" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="225.0" y="958.0" font-size="11" text-anchor="middle" fill="#496176">满足预算</text><path d="M 390 500.0 L 432 500.0 L 432 1058.0 L 390 1058.0" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="438" y="490.0" font-size="11" text-anchor="middle" fill="#496176">无需英译</text><path d="M 225.0 1116 C 225.0 1151.0, 225.0 1151.0, 225.0 1186" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="225.0" y="1144.0" font-size="11" text-anchor="middle" fill="#496176">有效响应</text><path d="M 225.0 1116 C 225.0 1151.0, 665.0 1151.0, 665.0 1186" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="445.0" y="1144.0" font-size="11" text-anchor="middle" fill="#496176">请求与错误处理</text><g class="node" data-node="port" tabindex="0"><title>角色工具白名单与推理开关：prepare只记录路由；WiredRoles.invoke仍调OfflineRoles；request才进入真实推理边界。；源码：src/gov_mcp/decision/connections.py:Connections.request</title><rect x="60" y="70" width="330" height="116" rx="12" fill="#fff4d8" stroke="#a56b13"/><text x="78" y="97" font-size="15" font-weight="700" fill="#183049">角色工具白名单与推理开关</text><text x="78" y="146" font-size="11" fill="#486075">prepare只记录路由；WiredRoles.invoke仍调Offlin</text><text x="78" y="163" font-size="11" fill="#486075">eRoles；request才进入真实推理边界。</text></g><g class="node" data-node="class" tabindex="0"><title>原始payload类别与输入预算：递归数据标签先于投影／翻译；工作台仅synthetic；public走隔离预览；UTF-8字节限额。；源码：src/gov_mcp/privacy.py:data_classes_allowed</title><rect x="60" y="256" width="330" height="116" rx="12" fill="#fff4d8" stroke="#a56b13"/><text x="78" y="283" font-size="15" font-weight="700" fill="#183049">原始payload类别与输入预算</text><text x="78" y="332" font-size="11" fill="#486075">递归数据标签先于投影／翻译；工作台仅synthetic</text><text x="78" y="349" font-size="11" fill="#486075">；public走隔离预览；UTF-8字节限额。</text></g><g class="node" data-node="ready" tabindex="0"><title>先检查供应商就绪和调用预算：已知缺凭据／封闭预算时不先浪费翻译；官方Jev固定版本jev-1.13.0。；源码：src/gov_mcp/classification.py:JevProvider.check_ready</title><rect x="60" y="442" width="330" height="116" rx="12" fill="#fff4d8" stroke="#a56b13"/><text x="78" y="469" font-size="15" font-weight="700" fill="#183049">先检查供应商就绪和调用预算</text><text x="78" y="518" font-size="11" fill="#486075">已知缺凭据／封闭预算时不先浪费翻译；官方Jev固</text><text x="78" y="535" font-size="11" fill="#486075">定版本jev-1.13.0。</text></g><g class="node" data-node="english" tabindex="0"><title>提取中文语义槽并英译：不改ID/SHA/locator/URL等opaque字段；保留否定、例外、范围、数字、单位；缓存限相同文本及配置。；源码：src/gov_mcp/jev_translation.py:EnglishJevProvider</title><rect x="60" y="628" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="655" font-size="15" font-weight="700" fill="#183049">提取中文语义槽并英译</text><text x="78" y="704" font-size="11" fill="#486075">不改ID/SHA/locator/URL等opaque字段；保留否定、</text><text x="78" y="721" font-size="11" fill="#486075">例外、范围、数字、单位；缓存限相同文本及配置。</text></g><g class="node" data-node="validate" tabindex="0"><title>核对译文及翻译后大小：字段必须一一对应，数字一致，不能残留中文；重新算UTF-8请求字节；英文与中文原文可对照。；源码：src/gov_mcp/jev_translation.py:EnglishJevProvider</title><rect x="60" y="814" width="330" height="116" rx="12" fill="#fff4d8" stroke="#a56b13"/><text x="78" y="841" font-size="15" font-weight="700" fill="#183049">核对译文及翻译后大小</text><text x="78" y="890" font-size="11" fill="#486075">字段必须一一对应，数字一致，不能残留中文；重新</text><text x="78" y="907" font-size="11" fill="#486075">算UTF-8请求字节；英文与中文原文可对照。</text></g><g class="node" data-node="jev" tabindex="0"><title>Jev分类／原文支持概率：按窗口合并文档类型、业务领域、片段用途；问题数及字节预算；响应模型／问项／概率均校验。；源码：src/gov_mcp/classification.py:classify_corpus</title><rect x="60" y="1000" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="1027" font-size="15" font-weight="700" fill="#183049">Jev分类／原文支持概率</text><text x="78" y="1076" font-size="11" fill="#486075">按窗口合并文档类型、业务领域、片段用途；问题数</text><text x="78" y="1093" font-size="11" fill="#486075">及字节预算；响应模型／问项／概率均校验。</text></g><g class="node" data-node="review" tabindex="0"><title>不确定、近似类别及冲突待核：阈值、top类别间距、用途冲突供人工复核；支持概率不替代业务判断；记录usage与缓存token明细。；源码：src/gov_mcp/classification.py:validate_response</title><rect x="60" y="1186" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="1213" font-size="15" font-weight="700" fill="#183049">不确定、近似类别及冲突待核</text><text x="78" y="1262" font-size="11" fill="#486075">阈值、top类别间距、用途冲突供人工复核；支持概</text><text x="78" y="1279" font-size="11" fill="#486075">率不替代业务判断；记录usage与缓存token明细。</text></g><g class="node" data-node="network" tabindex="0"><title>网络及外部失败边界：云端DeepSeek/Jev沿用已有环境／系统代理且TLS校验；本地服务直连。通用采集／embedding路径接线需分别看源码。；源码：src/gov_mcp/deepseek.py:chat</title><rect x="500" y="1186" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="518" y="1213" font-size="15" font-weight="700" fill="#183049">网络及外部失败边界</text><text x="518" y="1262" font-size="11" fill="#486075">云端DeepSeek/Jev沿用已有环境／系统代理且TLS校</text><text x="518" y="1279" font-size="11" fill="#486075">验；本地服务直连。通用采集／embedding路径接线…</text></g></svg>