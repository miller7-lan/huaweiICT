</text><text x="78" y="163" font-size="11" fill="#486075">范围与间隔；启用须近期访问及使用审核；配置变化…</text></g><g class="node" data-node="sched" tabindex="0"><title>schedule到期入队：只入enabled且未暂停来源；发现模式创建cycle，否则seeds和既有URL入队；不重复有效任务。；源码：src/gov_mcp/knowledge_fetch.py:schedule</title><rect x="60" y="256" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="283" font-size="15" font-weight="700" fill="#183049">schedule到期入队</text><text x="78" y="332" font-size="11" fill="#486075">只入enabled且未暂停来源；发现模式创建cycle，否</text><text x="78" y="349" font-size="11" fill="#486075">则seeds和既有URL入队；不重复有效任务。</text></g><g class="node" data-node="claim" tabindex="0"><title>worker_once认领一项：BEGIN IMMEDIATE；同来源运行互斥；attempts&lt;3；常规租约180秒、OCR600秒。；源码：src/gov_mcp/knowledge_fetch.py:worker_once</title><rect x="60" y="442" width="330" height="116" rx="12" fill="#fff4d8" stroke="#a56b13"/><text x="78" y="469" font-size="15" font-weight="700" fill="#183049">worker_once认领一项</text><text x="78" y="518" font-size="11" fill="#486075">BEGIN IMMEDIATE；同来源运行互斥；attempts&lt;3；</text><text x="78" y="535" font-size="11" fill="#486075">常规租约180秒、OCR600秒。</text></g><g class="node" data-node="fetch" tabindex="0"><title>robots、网络与正文获取：校验DNS／地址、路径、大小、限速、重定向、证书及robots；原采集器使用直连接线，专用代理实验不等于通用路径已修好。；源码：src/gov_mcp/knowledge_fetch.py:Fetcher.fetch</title><rect x="60" y="628" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="655" font-size="15" font-weight="700" fill="#183049">robots、网络与正文获取</text><text x="78" y="704" font-size="11" fill="#486075">校验DNS／地址、路径、大小、限速、重定向、证书</text><text x="78" y="721" font-size="11" fill="#486075">及robots；原采集器使用直连接线，专用代理实验不…</text></g><g class="node" data-node="index" tabindex="0"><title>索引／RSS／Atom／Sitemap：record_index记录链接、深度、范围与截断信号；发现不等于已采集或业务有效。；源码：src/gov_mcp/knowledge_discovery.py:record_index</title><rect x="60" y="814" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="841" font-size="15" font-weight="700" fill="#183049">索引／RSS／Atom／Sitemap</text><text x="78" y="890" font-size="11" fill="#486075">record_index记录链接、深度、范围与截断信号；发</text><text x="78" y="907" font-size="11" fill="#486075">现不等于已采集或业务有效。</text></g><g class="node" data-node="304" tabindex="0"><title>304 未变化：刷新检查时间；保留已存原件与批准；可从原件继续发现附件。；源码：src/gov_mcp/knowledge_fetch.py:worker_once</title><rect x="500" y="814" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="518" y="841" font-size="15" font-weight="700" fill="#183049">304 未变化</text><text x="518" y="890" font-size="11" fill="#486075">刷新检查时间；保留已存原件与批准；可从原件继续</text><text x="518" y="907" font-size="11" fill="#486075">发现附件。</text></g><g class="node" data-node="200" tabindex="0"><title>200 正文：仅HTML／PDF；网页空壳不可冒充正文；附件模式要求真实PDF头。；源码：src/gov_mcp/knowledge_fetch.py:worker_once</title><rect x="940" y="814" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="958" y="841" font-size="15" font-weight="700" fill="#183049">200 正文</text><text x="958" y="890" font-size="11" fill="#486075">仅HTML／PDF；网页空壳不可冒充正文；附件模式要</text><text x="958" y="907" font-size="11" fill="#486075">求真实PDF头。</text></g><g class="node" data-node="parse" tabindex="0"><title>隔离解析及选段：HTML选择器／段落组／条款；PDF子进程30秒、OCR150秒；无选中正文隔离；新变化不继承旧生效日。；源码：src/gov_mcp/knowledge_fetch.py:worker_once</title><rect x="60" y="1000" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="1027" font-size="15" font-weight="700" fill="#183049">隔离解析及选段</text><text x="78" y="1076" font-size="11" fill="#486075">HTML选择器／段落组／条款；PDF子进程30秒、OCR15</text><text x="78" y="1093" font-size="11" fill="#486075">0秒；无选中正文隔离；新变化不继承旧生效日。</text></g><g class="node" data-node="ingest" tabindex="0"><title>原件保全、修订去重和候选：归档完整HTTP原件＋选择段；提出分类、关联附件；成功done并在全来源任务完成后刷新last_success。；源码：src/gov_mcp/knowledge/registry.py:KnowledgeStore.ingest</title><rect x="60" y="1186" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="1213" font-size="15" font-weight="700" fill="#183049">原件保全、修订去重和候选</text><text x="78" y="1262" font-size="11" fill="#486075">归档完整HTTP原件＋选择段；提出分类、关联附件；</text><text x="78" y="1279" font-size="11" fill="#486075">成功done并在全来源任务完成后刷新last_success。</text></g><g class="node" data-node="fail" tabindex="0"><title>失败／暂停／退避：AccessStopped立即暂停来源；其他失败最多3次，退避60/300/1800或Retry-After；过期最后租约标failed。；源码：src/gov_mcp/knowledge_fetch.py:worker_once</title><rect x="60" y="1372" width="330" height="116" rx="12" fill="#ffeded" stroke="#b74343"/><text x="78" y="1399" font-size="15" font-weight="700" fill="#183049">失败／暂停／退避</text><text x="78" y="1448" font-size="11" fill="#486075">AccessStopped立即暂停来源；其他失败最多3次，退</text><text x="78" y="1465" font-size="11" fill="#486075">避60/300/1800或Retry-After；过期最后租约标fail…</text></g></svg>