ext class="edgeLabel" x="225.0" y="1144.0" font-size="11" text-anchor="middle" fill="#496176">完整验证成功</text><path d="M 225.0 1302 C 225.0 1337.0, 225.0 1337.0, 225.0 1372" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="225.0" y="1330.0" font-size="11" text-anchor="middle" fill="#496176">需要回退时</text><path d="M 390 1430.0 C 444 1430.0, 444 500.0, 390 500.0" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="434" y="965.0" font-size="11" text-anchor="middle" fill="#496176">下次发布重新校验</text><g class="node" data-node="select" tabindex="0"><title>选择待审包与对象：仅awaiting_review；ID不重复、不含已发布项；可accepted或rejected且意见1–2000字符。；源码：src/gov_mcp/decision/workflow.py:Workflow.review</title><rect x="60" y="70" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="97" font-size="15" font-weight="700" fill="#183049">选择待审包与对象</text><text x="78" y="146" font-size="11" fill="#486075">仅awaiting_review；ID不重复、不含已发布项；可a</text><text x="78" y="163" font-size="11" fill="#486075">ccepted或rejected且意见1–2000字符。</text></g><g class="node" data-node="basis" tabindex="0"><title>记录逐对象复核依据：actor、decision、note、time和basis_hash绑定；仅复核不切换知识版本。；源码：src/gov_mcp/decision/workflow.py:Workflow.review</title><rect x="60" y="256" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="283" font-size="15" font-weight="700" fill="#183049">记录逐对象复核依据</text><text x="78" y="332" font-size="11" fill="#486075">actor、decision、note、time和basis_hash绑定；</text><text x="78" y="349" font-size="11" fill="#486075">仅复核不切换知识版本。</text></g><g class="node" data-node="head" tabindex="0"><title>发布前核对当前头及来源：expected_head一致；来源仍启用、批准、当前包且内容指纹相同；依赖不能相对base变化。；源码：src/gov_mcp/decision/workflow.py:Workflow.publish</title><rect x="60" y="442" width="330" height="116" rx="12" fill="#fff4d8" stroke="#a56b13"/><text x="78" y="469" font-size="15" font-weight="700" fill="#183049">发布前核对当前头及来源</text><text x="78" y="518" font-size="11" fill="#486075">expected_head一致；来源仍启用、批准、当前包且</text><text x="78" y="535" font-size="11" fill="#486075">内容指纹相同；依赖不能相对base变化。</text></g><g class="node" data-node="actor" tabindex="0"><title>核对同一发布人已接受：accepted review由同一actor给出且basis_hash精确匹配；任一项不符整次失败。；源码：src/gov_mcp/decision/workflow.py:Workflow.publish</title><rect x="60" y="628" width="330" height="116" rx="12" fill="#fff4d8" stroke="#a56b13"/><text x="78" y="655" font-size="15" font-weight="700" fill="#183049">核对同一发布人已接受</text><text x="78" y="704" font-size="11" fill="#486075">accepted review由同一actor给出且basis_hash精确</text><text x="78" y="721" font-size="11" fill="#486075">匹配；任一项不符整次失败。</text></g><g class="node" data-node="merge" tabindex="0"><title>合并选中的知识记录：要求、别名或本体提案；本体扩展登记executable=false，不伪称新规则可执行。；源码：src/gov_mcp/decision/workflow.py:Workflow.publish</title><rect x="60" y="814" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="841" font-size="15" font-weight="700" fill="#183049">合并选中的知识记录</text><text x="78" y="890" font-size="11" fill="#486075">要求、别名或本体提案；本体扩展登记executable=f</text><text x="78" y="907" font-size="11" fill="#486075">alse，不伪称新规则可执行。</text></g><g class="node" data-node="valid" tabindex="0"><title>生成传递依赖复核哈希：验证全图、原文span及review；压缩活动快照中无引用记录，历史快照仍保存。；源码：src/gov_mcp/decision/models.py:reviewed_hash</title><rect x="60" y="1000" width="330" height="116" rx="12" fill="#fff4d8" stroke="#a56b13"/><text x="78" y="1027" font-size="15" font-weight="700" fill="#183049">生成传递依赖复核哈希</text><text x="78" y="1076" font-size="11" fill="#486075">验证全图、原文span及review；压缩活动快照中无引</text><text x="78" y="1093" font-size="11" fill="#486075">用记录，历史快照仍保存。</text></g><g class="node" data-node="switch" tabindex="0"><title>事务内切换wf_head：更新知识／文档版本及accepted_hash；部分或全部发布；旧依赖哈希仍会保持暂停。；源码：src/gov_mcp/decision/workflow.py:Workflow.publish</title><rect x="60" y="1186" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="1213" font-size="15" font-weight="700" fill="#183049">事务内切换wf_head</text><text x="78" y="1262" font-size="11" fill="#486075">更新知识／文档版本及accepted_hash；部分或全部</text><text x="78" y="1279" font-size="11" fill="#486075">发布；旧依赖哈希仍会保持暂停。</text></g><g class="node" data-node="rollback" tabindex="0"><title>显式回退历史版本：检查expected_head与目标版本指纹；只切换头，conflicts_automatically_cleared=false。；源码：src/gov_mcp/decision/workflow.py:Workflow.rollback</title><rect x="60" y="1372" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="1399" font-size="15" font-weight="700" fill="#183049">显式回退历史版本</text><text x="78" y="1448" font-size="11" fill="#486075">检查expected_head与目标版本指纹；只切换头，con</text><text x="78" y="1465" font-size="11" fill="#486075">flicts_automatically_cleared=false。</text></g></svg>