<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="16 · 8782北京／南京跨地区原生预览" viewBox="0 0 1000 1402" width="1000" height="1402"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#72859b"/></marker></defs><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif}.node{cursor:pointer}.node:hover rect{stroke-width:3}.edgeLabel{paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}</style><rect width="1000" height="1402" fill="#fff"/><text x="60" y="32" fill="#183049" font-size="18" font-weight="700">16 · 8782北京／南京跨地区原生预览</text><path d="M 225.0 186 C 225.0 221.0, 225.0 221.0, 225.0 256" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="225.0" y="214.0" font-size="11" text-anchor="middle" fill="#496176">有效范围</text><path d="M 225.0 372 C 225.0 407.0, 225.0 407.0, 225.0 442" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="225.0" y="400.0" font-size="11" text-anchor="middle" fill="#496176">活动场景</text><path d="M 225.0 558 C 225.0 593.0, 225.0 593.0, 225.0 628" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="225.0" y="586.0" font-size="11" text-anchor="middle" fill="#496176">opened</text><path d="M 225.0 744 C 225.0 779.0, 225.0 779.0, 225.0 814" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="225.0" y="772.0" font-size="11" text-anchor="middle" fill="#496176">retrieved</text><path d="M 225.0 930 C 225.0 965.0, 225.0 965.0, 225.0 1000" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="225.0" y="958.0" font-size="11" text-anchor="middle" fill="#496176">预留Jev额度</text><path d="M 225.0 1116 C 225.0 1151.0, 225.0 1151.0, 225.0 1186" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="225.0" y="1144.0" font-size="11" text-anchor="middle" fill="#496176">有效结果</text><path d="M 225.0 1116 C 225.0 1151.0, 665.0 1151.0, 665.0 1186" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="445.0" y="1144.0" font-size="11" text-anchor="middle" fill="#496176">传输／鉴权／余额阻断</text><g class="node" data-node="context" tabindex="0"><title>校验两地区候选快照：北京15段／南京3段；共享目录与原件SHA一致；独立候选库；地区／事项隔离，24小时快照约束。；源码：src/gov_mcp/regional_preview.py:check_context</title><rect x="60" y="70" width="330" height="116" rx="12" fill="#fff4d8" stroke="#a56b13"/><text x="78" y="97" font-size="15" font-weight="700" fill="#183049">校验两地区候选快照</text><text x="78" y="146" font-size="11" fill="#486075">北京15段／南京3段；共享目录与原件SHA一致；独立</text><text x="78" y="163" font-size="11" fill="#486075">候选库；地区／事项隔离，24小时快照约束。</text></g><g class="node" data-node="budget" tabindex="0"><title>有界活动与场景顺序：整轮原生≤3，Jev尝试≤3；北京先首次、两地首次后才重试；成功场景不再跑；不得并发活动。；源码：src/gov_mcp/regional_preview.py:RegionalPreview.begin_run</title><rect x="60" y="256" width="330" height="116" rx="12" fill="#fff4d8" stroke="#a56b13"/><text x="78" y="283" font-size="15" font-weight="700" fill="#183049">有界活动与场景顺序</text><text x="78" y="332" font-size="11" fill="#486075">整轮原生≤3，Jev尝试≤3；北京先首次、两地首次</text><text x="78" y="349" font-size="11" fill="#486075">后才重试；成功场景不再跑；不得并发活动。</text></g><g class="node" data-node="open" tabindex="0"><title>按scenario_id建任务：活动run必须匹配scenario；绑定两地context及当前暂停；同一run任务幂等。；源码：src/gov_mcp/regional_preview.py:RegionalPreview.open_query</title><rect x="60" y="442" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="469" font-size="15" font-weight="700" fill="#183049">按scenario_id建任务</text><text x="78" y="518" font-size="11" fill="#486075">活动run必须匹配scenario；绑定两地context及当前</text><text x="78" y="535" font-size="11" fill="#486075">暂停；同一run任务幂等。</text></g><g class="node" data-node="ret" tabindex="0"><title>只取本场景完整原文条件：检索保留选段、来源及相关条件；不把北京材料当南京依据，反之亦然。；源码：src/gov_mcp/regional_preview.py:RegionalPreview.retrieve</title><rect x="60" y="628" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="655" font-size="15" font-weight="700" fill="#183049">只取本场景完整原文条件</text><text x="78" y="704" font-size="11" fill="#486075">检索保留选段、来源及相关条件；不把北京材料当南</text><text x="78" y="721" font-size="11" fill="#486075">京依据，反之亦然。</text></g><g class="node" data-node="verify" tabindex="0"><title>核验与专属负例：南京承诺3天无依据；北京对应情境负例；支持核验只解释来源，不决定现行适用性。；源码：src/gov_mcp/regional_preview.py:RegionalPreview.verify</title><rect x="60" y="814" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="841" font-size="15" font-weight="700" fill="#183049">核验与专属负例</text><text x="78" y="890" font-size="11" fill="#486075">南京承诺3天无依据；北京对应情境负例；支持核验</text><text x="78" y="907" font-size="11" fill="#486075">只解释来源，不决定现行适用性。</text></g><g class="node" data-node="receipt" tabindex="0"><title>保存实际英文与Jev回执：最终实现请求前存实际英文；旧北京失败仅有英文哈希，不能恢复或补造正文。；源码：src/gov_mcp/regional_preview.py:RegionalLiveVerifier.__call__</title><rect x="60" y="1000" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="1027" font-size="15" font-weight="700" fill="#183049">保存实际英文与Jev回执</text><text x="78" y="1076" font-size="11" fill="#486075">最终实现请求前存实际英文；旧北京失败仅有英文哈</text><text x="78" y="1093" font-size="11" fill="#486075">希，不能恢复或补造正文。</text></g><g class="node" data-node="final" tabindex="0"><title>返回前重新验源、暂停和回执：逐项分数／未知值／暂停原因；持久化最终答复必须一致。；源码：src/gov_mcp/regional_preview.py:RegionalPreview.finalize</title><rect x="60" y="1186" width="330" height="116" rx="12" fill="#fff4d8" stroke="#a56b13"/><text x="78" y="1213" font-size="15" font-weight="700" fill="#183049">返回前重新验源、暂停和回执</text><text x="78" y="1262" font-size="11" fill="#486075">逐项分数／未知值／暂停原因；持久化最终答复必须</text><text x="78" y="1279" font-size="11" fill="#486075">一致。</text></g><g class="node" data-node="stop" tabindex="0"><title>external_block全轮停止：不得清空预算、自动换供应商或将南京通过扩展为北京通过。；源码：src/gov_mcp/regional_preview.py:RegionalPreview.verify</title><rect x="500" y="1186" width="330" height="116" rx="12" fill="#ffeded" stroke="#b74343"/><text x="518" y="1213" font-size="15" font-weight="700" fill="#183049">external_block全轮停止</text><text x="518" y="1262" font-size="11" fill="#486075">不得清空预算、自动换供应商或将南京通过扩展为北</text><text x="518" y="1279" font-size="11" fill="#486075">京通过。</text></g></svg>