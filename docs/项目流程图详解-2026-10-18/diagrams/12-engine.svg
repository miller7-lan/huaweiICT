text><text x="78" y="1093" font-size="11" fill="#486075">，生成向量并校验维度、有限值及原件。</text></g><g class="node" data-node="rules" tabindex="0"><title>人工review／规则发布：文件可检索不等于业务规则批准；本体候选、冲突和支持度须复核；版本头与来源仍须核对。；源码：src/gov_mcp/knowledge/engine.py:Engine</title><rect x="60" y="1186" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="1213" font-size="15" font-weight="700" fill="#183049">人工review／规则发布</text><text x="78" y="1262" font-size="11" fill="#486075">文件可检索不等于业务规则批准；本体候选、冲突和</text><text x="78" y="1279" font-size="11" fill="#486075">支持度须复核；版本头与来源仍须核对。</text></g><g class="node" data-node="retry" tabindex="0"><title>等待凭据／等待供应商／重试：缺Jev凭据不启动无效Agent；异常设置60秒重试并abort；持久化阶段供恢复。；源码：src/gov_mcp/knowledge/worker.py:Worker.round</title><rect x="500" y="1186" width="330" height="116" rx="12" fill="#ffeded" stroke="#b74343"/><text x="518" y="1213" font-size="15" font-weight="700" fill="#183049">等待凭据／等待供应商／重试</text><text x="518" y="1262" font-size="11" fill="#486075">缺Jev凭据不启动无效Agent；异常设置60秒重试并ab</text><text x="518" y="1279" font-size="11" fill="#486075">ort；持久化阶段供恢复。</text></g></svg>