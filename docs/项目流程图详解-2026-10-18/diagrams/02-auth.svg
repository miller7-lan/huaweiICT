ze="11" text-anchor="middle" fill="#496176">过期／角色不符</text><path d="M 225.0 744 C 225.0 779.0, 225.0 779.0, 225.0 814" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="225.0" y="772.0" font-size="11" text-anchor="middle" fill="#496176">通过</text><path d="M 225.0 930 C 225.0 965.0, 225.0 965.0, 225.0 1000" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="225.0" y="958.0" font-size="11" text-anchor="middle" fill="#496176">需要模型外发时</text><path d="M 390 1058.0 C 884 1058.0, 884 314.0, 830 314.0" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="874" y="686.0" font-size="11" text-anchor="middle" fill="#496176">不允许的数据类别</text><path d="M 225.0 1116 C 225.0 1151.0, 225.0 1151.0, 225.0 1186" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="225.0" y="1144.0" font-size="11" text-anchor="middle" fill="#496176">通过</text><g class="node" data-node="req" tabindex="0"><title>HTTP 请求：TrustedHost限制localhost、127.0.0.1及host.docker.internal。；源码：src/gov_mcp/decision/server.py:create_app</title><rect x="60" y="70" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="97" font-size="15" font-weight="700" fill="#183049">HTTP 请求</text><text x="78" y="146" font-size="11" fill="#486075">TrustedHost限制localhost、127.0.0.1及host.dock</text><text x="78" y="163" font-size="11" fill="#486075">er.internal。</text></g><g class="node" data-node="kind" tabindex="0"><title>区分 MCP 与网页：MCP校验服务Bearer；网页POST要求同源Origin。；源码：src/gov_mcp/decision/server.py:create_app.Gate.__call__</title><rect x="60" y="256" width="330" height="116" rx="12" fill="#fff4d8" stroke="#a56b13"/><text x="78" y="283" font-size="15" font-weight="700" fill="#183049">区分 MCP 与网页</text><text x="78" y="332" font-size="11" fill="#486075">MCP校验服务Bearer；网页POST要求同源Origin。</text></g><g class="node" data-node="bad" tabindex="0"><title>拒绝请求：权限失败403；参数／版本／存储校验失败409；超限413；不向页面透传密钥或原始异常。；源码：src/gov_mcp/decision/server.py:create_app.Gate.__call__</title><rect x="500" y="256" width="330" height="116" rx="12" fill="#ffeded" stroke="#b74343"/><text x="518" y="283" font-size="15" font-weight="700" fill="#183049">拒绝请求</text><text x="518" y="332" font-size="11" fill="#486075">权限失败403；参数／版本／存储校验失败409；超限</text><text x="518" y="349" font-size="11" fill="#486075">413；不向页面透传密钥或原始异常。</text></g><g class="node" data-node="size" tabindex="0"><title>接收前限制真实字节：MCP正文≤1MiB，网页≤65536字节；校验Content-Length并逐块累计。；源码：src/gov_mcp/decision/server.py:create_app.Gate.__call__</title><rect x="60" y="442" width="330" height="116" rx="12" fill="#fff4d8" stroke="#a56b13"/><text x="78" y="469" font-size="15" font-weight="700" fill="#183049">接收前限制真实字节</text><text x="78" y="518" font-size="11" fill="#486075">MCP正文≤1MiB，网页≤65536字节；校验Content-Le</text><text x="78" y="535" font-size="11" fill="#486075">ngth并逐块累计。</text></g><g class="node" data-node="session" tabindex="0"><title>校验会话及专业角色：会话4小时；群众最多1024，专业人员64；专业登录需本地令牌。；源码：src/gov_mcp/decision/server.py:create_app.session</title><rect x="60" y="628" width="330" height="116" rx="12" fill="#fff4d8" stroke="#a56b13"/><text x="78" y="655" font-size="15" font-weight="700" fill="#183049">校验会话及专业角色</text><text x="78" y="704" font-size="11" fill="#486075">会话4小时；群众最多1024，专业人员64；专业登录</text><text x="78" y="721" font-size="11" fill="#486075">需本地令牌。</text></g><g class="node" data-node="own" tabindex="0"><title>任务归属／幂等请求：群众只读本人任务；request_id同输入才复用；复用仍重读暂停状态；每会话最多200任务。；源码：src/gov_mcp/decision/server.py:create_app.api</title><rect x="60" y="814" width="330" height="116" rx="12" fill="#fff4d8" stroke="#a56b13"/><text x="78" y="841" font-size="15" font-weight="700" fill="#183049">任务归属／幂等请求</text><text x="78" y="890" font-size="11" fill="#486075">群众只读本人任务；request_id同输入才复用；复用</text><text x="78" y="907" font-size="11" fill="#486075">仍重读暂停状态；每会话最多200任务。</text></g><g class="node" data-node="class" tabindex="0"><title>递归检查原始数据标签：在投影或翻译前检查嵌套dict/list/tuple的data_class；不允许借嵌套标签绕过限制。；源码：src/gov_mcp/privacy.py:data_classes_allowed</title><rect x="60" y="1000" width="330" height="116" rx="12" fill="#fff4d8" stroke="#a56b13"/><text x="78" y="1027" font-size="15" font-weight="700" fill="#183049">递归检查原始数据标签</text><text x="78" y="1076" font-size="11" fill="#486075">在投影或翻译前检查嵌套dict/list/tuple的data_cl</text><text x="78" y="1093" font-size="11" fill="#486075">ass；不允许借嵌套标签绕过限制。</text></g><g class="node" data-node="call" tabindex="0"><title>调用获准程序工具：有推理开关和角色能力边界；来源内容只作为数据；日志与响应受控。；源码：src/gov_mcp/decision/connections.py:Connections.request</title><rect x="60" y="1186" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="1213" font-size="15" font-weight="700" fill="#183049">调用获准程序工具</text><text x="78" y="1262" font-size="11" fill="#486075">有推理开关和角色能力边界；来源内容只作为数据；</text><text x="78" y="1279" font-size="11" fill="#486075">日志与响应受控。</text></g></svg>