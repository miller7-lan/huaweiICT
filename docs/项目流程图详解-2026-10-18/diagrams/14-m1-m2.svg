78" y="704" font-size="11" fill="#486075">task不再draft后不能任意改材料；同idempotency_k</text><text x="78" y="721" font-size="11" fill="#486075">ey重复交接复用原单；保存引用和材料快照。</text></g><g class="node" data-node="staff" tabindex="0"><title>工作人员队列与前置核对：仅同租户handoff；原身份证missing／unknown分别展示；户口簿要求等保留待核。；源码：src/gov_mcp/m2.py:M2Tools.assessment</title><rect x="60" y="814" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="841" font-size="15" font-weight="700" fill="#183049">工作人员队列与前置核对</text><text x="78" y="890" font-size="11" fill="#486075">仅同租户handoff；原身份证missing／unknown分别</text><text x="78" y="907" font-size="11" fill="#486075">展示；户口簿要求等保留待核。</text></g><g class="node" data-node="confirm" tabindex="0"><title>显式确认assessment_sha256：confirmed=true且指纹一致；冲突不覆盖；记录demo_ui_confirmation，不声称业务规则已审定。；源码：src/gov_mcp/m2.py:M2Tools.dispatch</title><rect x="60" y="1000" width="330" height="116" rx="12" fill="#fff4d8" stroke="#a56b13"/><text x="78" y="1027" font-size="15" font-weight="700" fill="#183049">显式确认assessment_sha256</text><text x="78" y="1076" font-size="11" fill="#486075">confirmed=true且指纹一致；冲突不覆盖；记录demo</text><text x="78" y="1093" font-size="11" fill="#486075">_ui_confirmation，不声称业务规则已审定。</text></g><g class="node" data-node="done" tabindex="0"><title>demo_reviewed＋工具审计：租户、所有权和工具角色矩阵均校验；数据库锁／存储失败返回明确错误。；源码：src/gov_mcp/m2.py:M2Tools.execute</title><rect x="60" y="1186" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="1213" font-size="15" font-weight="700" fill="#183049">demo_reviewed＋工具审计</text><text x="78" y="1262" font-size="11" fill="#486075">租户、所有权和工具角色矩阵均校验；数据库锁／存</text><text x="78" y="1279" font-size="11" fill="#486075">储失败返回明确错误。</text></g></svg>