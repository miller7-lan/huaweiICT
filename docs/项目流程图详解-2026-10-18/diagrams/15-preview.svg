open_query固定情境</text><text x="78" y="518" font-size="11" fill="#486075">CASE及QUESTION必须精确匹配；只有活动run能创建</text><text x="78" y="535" font-size="11" fill="#486075">任务；同run复用任务。</text></g><g class="node" data-node="ret" tabindex="0"><title>检索子Agent retrieve：从manifest提取五项来源事实，绑定原文quote／SHA／locator；opened→retrieved。；源码：src/gov_mcp/public_preview.py:Preview.retrieve</title><rect x="60" y="628" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="655" font-size="15" font-weight="700" fill="#183049">检索子Agent retrieve</text><text x="78" y="704" font-size="11" fill="#486075">从manifest提取五项来源事实，绑定原文quote／SHA</text><text x="78" y="721" font-size="11" fill="#486075">／locator；opened→retrieved。</text></g><g class="node" data-node="verify" tabindex="0"><title>核验子Agent verify：验证精确检索与活动run；先持久化Jev预留计数／verifying；相同任务已核验结果可复用。；源码：src/gov_mcp/public_preview.py:Preview.verify</title><rect x="60" y="814" width="330" height="116" rx="12" fill="#fff4d8" stroke="#a56b13"/><text x="78" y="841" font-size="15" font-weight="700" fill="#183049">核验子Agent verify</text><text x="78" y="890" font-size="11" fill="#486075">验证精确检索与活动run；先持久化Jev预留计数／ve</text><text x="78" y="907" font-size="11" fill="#486075">rifying；相同任务已核验结果可复用。</text></g><g class="node" data-node="jev" tabindex="0"><title>DeepSeek英译→Jev单次支持核验：逐原文陈述＋提前30天负例；要求英文回执；保留中文来源和请求／响应证据。；源码：src/gov_mcp/public_preview.py:LiveVerifier.__call__</title><rect x="60" y="1000" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="1027" font-size="15" font-weight="700" fill="#183049">DeepSeek英译→Jev单次支持核验</text><text x="78" y="1076" font-size="11" fill="#486075">逐原文陈述＋提前30天负例；要求英文回执；保留中</text><text x="78" y="1093" font-size="11" fill="#486075">文来源和请求／响应证据。</text></g><g class="node" data-node="final" tabindex="0"><title>finalize重新核对绑定与回执：回执SHA、probabilities、threshold=.8均须一致；≥.8仅source_supported；负例≤.2标拒绝。；源码：src/gov_mcp/public_preview.py:Preview.finalize</title><rect x="60" y="1186" width="330" height="