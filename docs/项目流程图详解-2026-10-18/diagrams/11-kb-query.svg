<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="11 · 正式知识检索与当前暂停门" viewBox="0 0 1000 1216" width="1000" height="1216"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#72859b"/></marker></defs><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif}.node{cursor:pointer}.node:hover rect{stroke-width:3}.edgeLabel{paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}</style><rect width="1000" height="1216" fill="#fff"/><text x="60" y="32" fill="#183049" font-size="18" font-weight="700">11 · 正式知识检索与当前暂停门</text><path d="M 225.0 186 C 225.0 221.0, 225.0 221.0, 225.0 256" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="225.0" y="214.0" font-size="11" text-anchor="middle" fill="#496176">校验输入</text><path d="M 390 314.0 L 500 314.0" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="445.0" y="306.0" font-size="11" text-anchor="middle" fill="#496176">无匹配版本</text><path d="M 225.0 372 C 225.0 407.0, 225.0 407.0, 225.0 442" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="225.0" y="400.0" font-size="11" text-anchor="middle" fill="#496176">存在</text><path d="M 225.0 558 C 225.0 593.0, 225.0 593.0, 225.0 628" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="225.0" y="586.0" font-size="11" text-anchor="middle" fill="#496176">验证通过</text><path d="M 225.0 744 C 225.0 779.0, 225.0 779.0, 225.0 814" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="225.0" y="772.0" font-size="11" text-anchor="middle" fill="#496176">检索结果</text><path d="M 225.0 930 C 225.0 965.0, 225.0 965.0, 225.0 1000" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="225.0" y="958.0" font-size="11" text-anchor="middle" fill="#496176">当前视图且存在风险</text><path d="M 225.0 930 C 225.0 965.0, 665.0 965.0, 665.0 1000" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="445.0" y="958.0" font-size="11" text-anchor="middle" fill="#496176">无阻断或显式历史版本</text><g class="node" data-node="input" tabindex="0"><title>query＋region＋matter＋日期：问题1–300字符；可显式选择已发布版本，区分过去／当前／未来日期视图。；源码：src/gov_mcp/knowledge/registry.py:KnowledgeStore.search</title><rect x="60" y="70" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="97" font-size="15" font-weight="700" fill="#183049">query＋region＋matter＋日期</text><text x="78" y="146" font-size="11" fill="#486075">问题1–300字符；可显式选择已发布版本，区分过去</text><text x="78" y="163" font-size="11" fill="#486075">／当前／未来日期视图。</text></g><g class="node" data-node="version" tabindex="0"><title>查scope中的published版本：默认当前heads；指定版本必须属于相同scope且state=published。；源码：src/gov_mcp/knowledge/registry.py:KnowledgeStore.search</title><rect x="60" y="256" width="330" height="116" rx="12" fill="#fff4d8" stroke="#a56b13"/><text x="78" y="283" font-size="15" font-weight="700" fill="#183049">查scope中的published版本</text><text x="78" y="332" font-size="11" fill="#486075">默认当前heads；指定版本必须属于相同scope且stat</text><text x="78" y="349" font-size="11" fill="#486075">e=published。</text></g><g class="node" data-node="none" tabindex="0"><title>EMPTY：无已发布知识：knowledge_version=null、citations=[]；不将待审候选凑成办理结论。；源码：src/gov_mcp/knowledge/registry.py:KnowledgeStore.search</title><rect x="500" y="256" width="330" height="116" rx="12" fill="#ffeded" stroke="#b74343"/><text x="518" y="283" font-size="15" font-weight="700" fill="#183049">EMPTY：无已发布知识</text><text x="518" y="332" font-size="11" fill="#486075">knowledge_version=null、citations=[]；不将待审</text><text x="518" y="349" font-size="11" fill="#486075">候选凑成办理结论。</text></g><g class="node" data-node="members" tabindex="0"><title>逐成员验证原件、正文与复核：按已核定的时间起点及修订顺序为每文档选择适用修订；未来未生效／已终止项排除。；源码：src/gov_mcp/knowledge/registry.py:KnowledgeStore._verify</title><rect x="60" y="442" width="330" height="116" rx="12" fill="#fff4d8" stroke="#a56b13"/><text x="78" y="469" font-size="15" font-weight="700" fill="#183049">逐成员验证原件、正文与复核</text><text x="78" y="518" font-size="11" fill="#486075">按已核定的时间起点及修订顺序为每文档选择适用修</text><text x="78" y="535" font-size="11" fill="#486075">订；未来未生效／已终止项排除。</text></g><g class="node" data-node="rank" tabindex="0"><title>字面召回并绑定完整引用：score_literal＋top_five；引用含revision、原件SHA、locator、chunk ordinal、版本和日期；不是稠密检索。；源码：src/gov_mcp/knowledge/registry.py:KnowledgeStore.search</title><rect x="60" y="628" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="655" font-size="15" font-weight="700" fill="#183049">字面召回并绑定完整引用</text><text x="78" y="704" font-size="11" fill="#486075">score_literal＋top_five；引用含revision、原件S</text><text x="78" y="721" font-size="11" fill="#486075">HA、locator、chunk ordinal、版本和日期；不是稠…</text></g><g class="node" data-node="current" tabindex="0"><title>重查最新状态及来源新鲜度：待复核、待发布、潜在相关未分类、来源暂停／失败／停用／超期均构成当前视图阻断。；源码：src/gov_mcp/knowledge/registry.py:KnowledgeStore.search</title><rect x="60" y="814" width="330" height="116" rx="12" fill="#fff4d8" stroke="#a56b13"/><text x="78" y="841" font-size="15" font-weight="700" fill="#183049">重查最新状态及来源新鲜度</text><text x="78" y="890" font-size="11" fill="#486075">待复核、待发布、潜在相关未分类、来源暂停／失败</text><text x="78" y="907" font-size="11" fill="#486075">／停用／超期均构成当前视图阻断。</text></g><g class="node" data-node="blocked" tabindex="0"><title>BLOCKED且不返回citations：UPDATE_PENDING_REVIEW / UPDATE_AWAITING_PUBLICATION / SOURCE_CHECK_REQUIRED。；源码：src/gov_mcp/knowledge/registry.py:KnowledgeStore.search</title><rect x="60" y="1000" width="330" height="116" rx="12" fill="#ffeded" stroke="#b74343"/><text x="78" y="1027" font-size="15" font-weight="700" fill="#183049">BLOCKED且不返回citations</text><text x="78" y="1076" font-size="11" fill="#486075">UPDATE_PENDING_REVIEW / UPDATE_AWAITING_PUBLIC</text><text x="78" y="1093" font-size="11" fill="#486075">ATION / SOURCE_CHECK_REQUIRED。</text></g><g class="node" data-node="ok" tabindex="0"><title>OK／EMPTY及历史标记：显式旧发布版本可历史追溯并报告freshness；不能把历史原文当作当前可办结论。；源码：src/gov_mcp/knowledge/registry.py:KnowledgeStore.search</title><rect x="500" y="1000" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="518" y="1027" font-size="15" font-weight="700" fill="#183049">OK／EMPTY及历史标记</text><text x="518" y="1076" font-size="11" fill="#486075">显式旧发布版本可历史追溯并报告freshness；不能</text><text x="518" y="1093" font-size="11" fill="#486075">把历史原文当作当前可办结论。</text></g></svg>