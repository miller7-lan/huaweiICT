 font-size="11" text-anchor="middle" fill="#496176">尚有缺口</text><path d="M 830 872.0 C 884 872.0, 884 686.0, 390 686.0" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="874" y="779.0" font-size="11" text-anchor="middle" fill="#496176">继续下一轮</text><path d="M 225.0 930 C 225.0 965.0, 225.0 965.0, 225.0 1000" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="225.0" y="958.0" font-size="11" text-anchor="middle" fill="#496176">齐备或第3轮结束</text><path d="M 225.0 1116 C 225.0 1151.0, 225.0 1151.0, 225.0 1186" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="225.0" y="1144.0" font-size="11" text-anchor="middle" fill="#496176">计算结果</text><path d="M 225.0 1302 C 225.0 1337.0, 225.0 1337.0, 225.0 1372" fill="none" stroke="#72859b" stroke-width="1.7" marker-end="url(#arrow)"/><text class="edgeLabel" x="225.0" y="1330.0" font-size="11" text-anchor="middle" fill="#496176">检查并落库</text><g class="node" data-node="q" tabindex="0"><title>接收 facts、branch_id、question：question≤2000字符，只作数据；补充任务须存在；可校验expected_head。；源码：src/gov_mcp/decision/workflow.py:Workflow.query</title><rect x="60" y="70" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="97" font-size="15" font-weight="700" fill="#183049">接收 facts、branch_id、question</text><text x="78" y="146" font-size="11" fill="#486075">question≤2000字符，只作数据；补充任务须存在；</text><text x="78" y="163" font-size="11" fill="#486075">可校验expected_head。</text></g><g class="node" data-node="pin" tabindex="0"><title>锁定版本与准备草稿：校验快照指纹；重建当前暂停；固定用户事实、分支、地区、日期和原文依赖。；源码：src/gov_mcp/decision/service.py:DecisionService.prepare</title><rect x="60" y="256" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="283" font-size="15" font-weight="700" fill="#183049">锁定版本与准备草稿</text><text x="78" y="332" font-size="11" fill="#486075">校验快照指纹；重建当前暂停；固定用户事实、分支</text><text x="78" y="349" font-size="11" fill="#486075">、地区、日期和原文依赖。</text></g><g class="node" data-node="need" tabindex="0"><title>计算未找到的证据ID：从全部草稿要求收集所需span；没有要求／证据则跳过检索。；源码：src/gov_mcp/decision/workflow.py:Workflow._evidence_request</title><rect x="60" y="442" width="330" height="116" rx="12" fill="#fff4d8" stroke="#a56b13"/><text x="78" y="469" font-size="15" font-weight="700" fill="#183049">计算未找到的证据ID</text><text x="78" y="518" font-size="11" fill="#486075">从全部草稿要求收集所需span；没有要求／证据则跳</text><text x="78" y="535" font-size="11" fill="#486075">过检索。</text></g><g class="node" data-node="ret" tabindex="0"><title>检索角色取登记证据：仅使用固定快照，不由Agent指定任意URL；每轮存任务与角色轨迹。；源码：src/gov_mcp/decision/workflow.py:Workflow._execute_query</title><rect x="60" y="628" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="655" font-size="15" font-weight="700" fill="#183049">检索角色取登记证据</text><text x="78" y="704" font-size="11" fill="#486075">仅使用固定快照，不由Agent指定任意URL；每轮存任</text><text x="78" y="721" font-size="11" fill="#486075">务与角色轨迹。</text></g><g class="node" data-node="ver" tabindex="0"><title>独立核验精确原文：所需ID与请求ID取交集；span必须等于登记内容，text[start:end]必须等于quote。；源码：src/gov_mcp/decision/workflow.py:Workflow._verify_retrieval</title><rect x="60" y="814" width="330" height="116" rx="12" fill="#fff4d8" stroke="#a56b13"/><text x="78" y="841" font-size="15" font-weight="700" fill="#183049">独立核验精确原文</text><text x="78" y="890" font-size="11" fill="#486075">所需ID与请求ID取交集；span必须等于登记内容，te</text><text x="78" y="907" font-size="11" fill="#486075">xt[start:end]必须等于quote。</text></g><g class="node" data-node="loop" tabindex="0"><title>仍有缺口且轮次小于3：仅针对真实缺口补检索；不重复完整材料；最多3轮。；源码：src/gov_mcp/decision/workflow.py:Workflow._verify_retrieval</title><rect x="500" y="814" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="518" y="841" font-size="15" font-weight="700" fill="#183049">仍有缺口且轮次小于3</text><text x="518" y="890" font-size="11" fill="#486075">仅针对真实缺口补检索；不重复完整材料；最多3轮</text><text x="518" y="907" font-size="11" fill="#486075">。</text></g><g class="node" data-node="unk" tabindex="0"><title>未取到证据的项降为unknown：EVIDENCE_RETRIEVAL_INCOMPLETE；用户未知字段不自动补全。；源码：src/gov_mcp/decision/workflow.py:Workflow._execute_query</title><rect x="60" y="1000" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="1027" font-size="15" font-weight="700" fill="#183049">未取到证据的项降为unknown</text><text x="78" y="1076" font-size="11" fill="#486075">EVIDENCE_RETRIEVAL_INCOMPLETE；用户未知字段不</text><text x="78" y="1093" font-size="11" fill="#486075">自动补全。</text></g><g class="node" data-node="gate" tabindex="0"><title>单写事务内返回前重验：重新读取版本、当前暂停，执行finalize，再持久化答复；异常将任务标failed。；源码：src/gov_mcp/decision/workflow.py:Workflow._execute_query</title><rect x="60" y="1186" width="330" height="116" rx="12" fill="#fff4d8" stroke="#a56b13"/><text x="78" y="1213" font-size="15" font-weight="700" fill="#183049">单写事务内返回前重验</text><text x="78" y="1262" font-size="11" fill="#486075">重新读取版本、当前暂停，执行finalize，再持久化</text><text x="78" y="1279" font-size="11" fill="#486075">答复；异常将任务标failed。</text></g><g class="node" data-node="out" tabindex="0"><title>分环节清单＋待核＋排除＋暂停：携带引用、版本、缺失字段、候选证据和轨迹；候选不进入确定清单。；源码：src/gov_mcp/decision/service.py:DecisionService.finalize</title><rect x="60" y="1372" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="1399" font-size="15" font-weight="700" fill="#183049">分环节清单＋待核＋排除＋暂停</text><text x="78" y="1448" font-size="11" fill="#486075">携带引用、版本、缺失字段、候选证据和轨迹；候选</text><text x="78" y="1465" font-size="11" fill="#486075">不进入确定清单。</text></g></svg>