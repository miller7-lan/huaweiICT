2" fill="#fff4d8" stroke="#a56b13"/><text x="78" y="469" font-size="15" font-weight="700" fill="#183049">govkb_verify_query</text><text x="78" y="518" font-size="11" fill="#486075">needs_verification→核验span，累计found_ids和r</text><text x="78" y="535" font-size="11" fill="#486075">ounds；重复调用复用已核验轮。</text></g><g class="node" data-node="state" tabindex="0"><title>govkb_query_state：只返回已存状态，供主控决定下一工具；不授权任意变更。；源码：src/gov_mcp/decision/server.py:create_app.govkb_query_state</title><rect x="500" y="442" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="518" y="469" font-size="15" font-weight="700" fill="#183049">govkb_query_state</text><text x="518" y="518" font-size="11" fill="#486075">只返回已存状态，供主控决定下一工具；不授权任意</text><text x="518" y="535" font-size="11" fill="#486075">变更。</text></g><g class="node" data-node="missing" tabindex="0"><title>needs_retrieval／can_finalize：有缺口且不足3轮继续；其余可结束，缺证据项保留unknown。；源码：src/gov_mcp/decision/workflow.py:Workflow._verify_retrieval</title><rect x="60" y="628" width="330" height="116" rx="12" fill="#fff4d8" stroke="#a56b13"/><text x="78" y="655" font-size="15" font-weight="700" fill="#183049">needs_retrieval／can_finalize</text><text x="78" y="704" font-size="11" fill="#486075">有缺口且不足3轮继续；其余可结束，缺证据项保留u</text><text x="78" y="721" font-size="11" fill="#486075">nknown。</text></g><g class="node" data-node="final" tabindex="0"><title>govkb_finalize_query：只接受can_finalize／complete；每次包括重试都重读当前暂停；首次保存持久化答复。；源码：src/gov_mcp/decision/workflow.py:Workflow.finalize_query</title><rect x="60" y="814" width="330" height="116" rx="12" fill="#eef4ff" stroke="#3368b7"/><text x="78" y="841" font-size="15" font-weight="700" fill="#183049">govkb_finalize_query</text><text x="78" y="890" font-size="11" fill="#486075">只接受can_finalize／complete；每次包括重试都重</text><text x="78" y="907" font-size="11" fill="#486075">读当前暂停；首次保存持久化答复。</text></g><g class="node" data-node="history" tabindex="0"><title>历史追溯：原始答复与current_availability并列；旧快照不能绕过当前暂停。；源码：src/gov_mcp/decis