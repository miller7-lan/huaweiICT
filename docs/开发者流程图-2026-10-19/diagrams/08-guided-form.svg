380.0 141" fill="none" stroke="#476f99"  stroke-width="1.6" marker-end="url(#seqArrow)"/></g><g id="08-guided-form-s1" class="node" tabindex="0"><title>src/gov_mcp/decision/intake.py:GuidedForm.__init__</title><text x="390.0" y="195" font-size="13" fill="#476f99">2. GuidedForm(workflow)：固定字段与版本；有效期30分钟</text><path d="M 380.0 221 L 640.0 221" fill="none" stroke="#476f99"  stroke-width="1.6" marker-end="url(#seqArrow)"/></g><g id="08-guided-form-s2" class="node" tabindex="0"><title>src/gov_mcp/decision/server.py:create_app.form_api</title><text x="130.0" y="275" font-size="13" fill="#476f99">3. POST answer：form_id、revision、field_id、answer</text><path d="M 120.0 301 L 380.0 301" fill="none" stroke="#476f99"  stroke-width="1.6" marker-end="url(#seqArrow)"/></g><g id="08-guided-form-s3" class="node" tabindex="0"><title>src/gov_mcp/decision/intake.py:GuidedForm.answer</title><text x="390.0" y="355" font-size="13" fill="#476f99">4. 会话归属＋revision校验；answer按顺序唯一匹配选项</text><path d="M 380.0 381 L 640.0 381" fill="none" stroke="#476f99"  stroke-width="1.6" marker-end="url(#seqArrow)"/></g><g id="08-guided-form-s4" class="node" tabindex="0"><title>src/gov_mcp/decision/intake.py:GuidedForm.answer</title><text x="650.0" y="435" font-size="13" fill="#9b7221">5. 编辑→revision++；reviewed=None；原确认立即失效</text><path d="M 640.0 454 L 680.0 454 L 680.0 470 L 640.0 470" fill="none" stroke="#9b7221"  stroke-width="1.6" marker-end="url(#seqArrow)"/></g><g id="08-guided-form-s5" class="node" tabindex="0"><title>src/gov_mcp/decision/server.py:create_app.form_api</title><text x="130.0" y="515" font-size="13" fill="#476f99">6. POST review：consent=true</text><path d="M 120.0 541 L 380.0 541" fill="none" stroke="#476f99"  stroke-width="1.6" marker-end="url(#seqArrow)"/></g><g id="08-guided-form-s6" class="node" tabindex="0"><title>src/gov_mcp/decision/server.py:create_app.form_api</title><text x="390.0" y="595" font-size="13" fill="#9b7221">7. 完整表单＋开关＋预算：全局20/会话3；并发槽2</text><path d="M 380.0 614 L 420.0 614 L 420.0 630 L 380.0 630" fill="none" stroke="#9b7221"  stroke-width="1.6" marker-end="url(#seqArrow)"/></g><g id="08-guided-form-s7" class="node" tabindex="0"><title>src/gov_mcp/decision/intake.py:GuidedForm.review</title><text x="390.0" y="675" font-size="13" fill="#476f99">8. to_thread(form.review)：校验字段schema与当前快照</text><path d="M 380.0 701 L 640.0 701" fill="none" stroke="#476f99"  stroke-width="1.6" marker-end="url(#seqArrow)"/></g><g id="08-guided-form-s8" class="node" tabindex="0"><title>src/gov_mcp/decision/intake.py:GuidedForm.review</title><text x="650.0" y="755" font-size="13" fill="#476f99">9. 同草稿/版本/规范值缓存可复用；否则verify(template, values)</text><path d="M 640.0 781 L 900.0 781" fill="none" stroke="#476f99"  stroke-width="1.6" marker-end="url(#seqArrow)"/></g><g id="08-guided-form-s9" class="node" tabindex="0"><title>src/gov_mcp/decision/intake.py:GuidedForm.review</title><text x="650.0" y="835" font-size="13" fill="#476f99">10. 返回JSON；value类型和值、display、unknown_fields均必须精确一致</text><path d="M 900.0 861 L 640.0 861" fill="none" stroke="#476f99" stroke-dasharray="6 4" stroke-width="1.6" marker-end="url(#seqArrow)"/></g><g id="08-guided-form-s10" class="node" tabindex="0"><title>src/gov_mcp/decision/intake.py:GuidedForm.review</title><text x="390.0" y="915" font-size="13" fill="#476f99">11. human_review：review_id + revision + 允许分支</text><path d="M 640.0 941 L 380.0 941" fill="none" stroke="#476f99" stroke-dasharray="6 4" stroke-width="1.6" marker-end="url(#seqArrow)"/></g><g id="08-guided-form-s11" class="node" tabindex="0"><title>src/gov_mcp/decision/server.py:create_app.form_api</title><text x="130.0" y="995" font-size="13" fill="#476f99">12. 显示核查结果；仍需人工逐项确认</text><path d="M 380.0 1021 L 120.0 1021" fill="none" stroke="#476f99" stroke-dasharray="6 4" stroke-width="1.6" marker-end="url(#seqArrow)"/></g><g id="08-guided-form-s12" class="node" tabindex="0"><title>src/gov_mcp/decision/server.py:create_app.form_api</title><text x="130.0" y="1075" font-size="13" fill="#476f99">13. POST submit：acknowledge=true、review_id、revision、branch_id</text><path d="M 120.0 1101 L 380.0 1101" fill="none" stroke="#476f99"  stroke-width="1.6" marker-end="url(#seqArrow)"/></g><g id="08-guided-form-s13" class="node" tabindex="0"><title>src/gov_mcp/decision/intake.py:GuidedForm.submit</title><text x="390.0" y="1155" font-size="13" fill="#9b7221">14. submit：复核ID/版本/分支有效；重复同分支复用回执</text><path d="M 380.0 1181 L 640.0 1181" fill="none" stroke="#9b7221"  stroke-width="1.6" marker-end="url(#seqArrow)"/></g><g id="08-guided-form-s14" class="node" tabindex="0"><title>src/gov_mcp/decision/intake.py:GuidedForm.submit</title><text x="650.0" y="1235" font-size="13" fill="#476f99">15. query(facts, branch_id, version_id, expected_head)</text><path d="M 640.0 1261 L 1160.0 1261" fill="none" stroke="#476f99"  stroke-width="1.6" marker-end="url(#seqArrow)"/></g><g id="08-guided-form-s15" class="node" tabindex="0"><title>src/gov_mcp/decision/intake.py:GuidedForm.submit</title><text x="390.0" y="1315" font-size="13" fill="#476f99">16. 本地咨询回执；清原回答和缓存；official_submission=false</text><path d="M 640.0 1341 L 380.0 1341" fill="none" stroke="#476f99" stroke-dasharray="6 4" stroke-width="1.6" marker-end="url(#seqArrow)"/></g><g id="08-guided-form-s16" class="node" tabindex="0"><title>src/gov_mcp/decision/server.py:create_app.form_api</title><text x="130.0" y="1395" font-size="13" fill="#476f99">17. 返回receipt＋当前可用性答复</text><path d="M 380.0 1421 L 120.0 1421" fill="none" stroke="#476f99" stroke-dasharray="6 4" stroke-width="1.6" marker-end="url(#seqArrow)"/></g><g id="08-guided-form-s17" class="node" tabindex="0"><title>src/gov_mcp/decision/server.py:create_app.form_api</title><rect x="20" y="1458" width="1240" height="70" rx="6" fill="#fff1ef" opacity=".8"/><text x="130.0" y="1475" font-size="13" fill="#b75a50">18. 失败分支：过期/改值/换版本/无确认/预算耗尽→拒绝；不自动补事实</text><path d="M 380.0 1501 L 120.0 1501" fill="none" stroke="#b75a50"  stroke-width="1.6" marker-end="url(#seqArrow)"/></g></svg>