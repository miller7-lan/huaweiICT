flow.py:Workflow._execute_query</title><rect x="20" y="978" width="1240" height="70" rx="6" fill="#fff8e9" opacity=".8"/><text x="650.0" y="995" font-size="13" fill="#9b7221">12. 保存complete + answer + documents_version + trace；COMMIT</text><path d="M 640.0 1021 L 1160.0 1021" fill="none" stroke="#9b7221"  stroke-width="1.6" marker-end="url(#seqArrow)"/></g><g id="02-http-query-s12" class="node" tabindex="0"><title>src/gov_mcp/decision/workflow.py:Workflow.query</title><text x="390.0" y="1075" font-size="13" fill="#476f99">13. 返回持久化answer；不调用正式政务提交</text><path d="M 640.0 1101 L 380.0 1101" fill="none" stroke="#476f99" stroke-dasharray="6 4" stroke-width="1.6" marker-end="url(#seqArrow)"/></g><g id="02-http-query-s13" class="node" tabindex="0"><title>src/gov_mcp/decision/server.py:create_app.api</title><text x="130.0" y="1155" font-size="13" fill="#476f99">14. JSONResponse(answer)</text><path d="M 380.0 1181 L 120.0 1181" fill="none" stroke="#476f99" stroke-dasharray="6 4" stroke-width="1.6" marker-end="url(#seqArrow)"/></g><g id="02-http-query-s14" class="node" tabindex="0"><title>src/gov_mcp/decision/workflow.py:Workflow.query</title><rect x="20" y="1218" width="1240" height="70" rx="6" fill="#fff1ef" opacity=".8"/><text x="650.0" y="1235" font-size="13" fill="#b75a50">15. 异常分支：当前事务ROLLBACK；另开事务写failed与审计，再抛异常</text><path d="M 640.0 1261 L 1160.0 1261" fill="none" stroke="#b75a50"  stroke-width="1.6" marker-end="url(#seqArrow)"/></g><g id="02-http-query-s15" class="node" tabindex="0"><title>src/gov_mcp/decision/server.py:create_app.Gate.__call__</title><rect x="20" y="1298" width="1240" height="70" rx="6" fill="#fff1ef" opacity=".8"/><text x="130.0" y="1315" font-size="13" fill="#b75a50">16. 已知校验异常409／权限403；未知异常由ASGI处理</text><path d="M 380.0 1341 L 120.0 1341" fill="none" stroke="#b75a50"  stroke-width="1.6" marker-end="url(#seqArrow)"/></g><g id="02-http-query-s16" class="node" tabindex="0"><title>src/gov_mcp/decision/server.py:create_app.api</title><rect x="20" y=