80.0 141" fill="none" stroke="#476f99"  stroke-width="1.6" marker-end="url(#seqArrow)"/></g><g id="07-cloud-preview-s1" class="node" tabindex="0"><title>src/gov_mcp/public_preview.py:Preview.verify</title><rect x="20" y="178" width="1240" height="70" rx="6" fill="#fff8e9" opacity=".8"/><text x="390.0" y="195" font-size="13" fill="#9b7221">2. TX1 BEGIN：重查来源绑定、facts、活动run与预算</text><path d="M 380.0 221 L 640.0 221" fill="none" stroke="#9b7221"  stroke-width="1.6" marker-end="url(#seqArrow)"/></g><g id="07-cloud-preview-s2" class="node" tabindex="0"><title>src/gov_mcp/public_preview.py:Preview.verify</title><text x="390.0" y="275" font-size="13" fill="#9b7221">3. 已有verification → 同task直接返回；不重复调用模型</text><path d="M 380.0 294 L 420.0 294 L 420.0 310 L 380.0 310" fill="none" stroke="#9b7221"  stroke-width="1.6" marker-end="url(#seqArrow)"/></g><g id="07-cloud-preview-s3" class="node" tabindex="0"><title>src/gov_mcp/public_preview.py:Preview.verify</title><rect x="20" y="338" width="1240" height="70" rx="6" fill="#fff8e9" opacity=".8"/><text x="390.0" y="355" font-size="13" fill="#9b7221">4. jev_reserved += 1；task.status=verifying；COMMIT</text><path d="M 380.0 381 L 640.0 381" fill="none" stroke="#9b7221"  stroke-width="1.6" marker-end="url(#seqArrow)"/></g><g id="07-cloud-preview-s4" class="node" tabindex="0"><title>src/gov_mcp/public_preview.py:LiveVerifier.__call__</title><text x="390.0" y="435" font-size="13" fill="#476f99">5. 构建public原文陈述＋专属负例；调用LiveVerifier</text><path d="M 380.0 454 L 420.0 454 L 420.0 470 L 380.0 470" fill="none" stroke="#476f99"  stroke-width="1.6" marker-end="url(#seqArrow)"/></g><g id="07-cloud-preview-s5" class="node" tabindex="0"><title>src/gov_mcp/jev_translation.py:EnglishJevProvider.evaluate</title><text x="390.0" y="515" font-size="13" fill="#476f99">6. EnglishJevProvider：只英译语义槽，ID/引用保持</text><path d="M 380.0 541 L 900.0 541" fill="none" stroke="#476f99"  stroke-width="1.6" marker-end="url(#seqArrow)"/></g><g id="07-cloud-preview-s6" class="node" tabindex="0"><title>src/gov_mcp/jev_translation.py:EnglishJevProvider.evaluate</title><text x="390.0" y="595" font-size="13" fill="#476f99">7. 返回英文；核对数字、字段覆盖、残留中文及字节限额</text><path d="M 900.0 621 L 380.0 621" fill="none" stroke="#476f99" stroke-dasharray="6 4" stroke-width="1.6" marker-end="url(#seqArrow)"/></g><g id="07-cloud-preview-s7" class="node" tabindex="0"><title>src/gov_mcp/public_preview.py:LiveVerifier.__call__</title><text x="390.0" y="675" font-size="13" fill="#476f99">8. evaluate(state_en, questions_en, jev-1.13.0)</text><path d="M 380.0 701 L 1160.0 701" fill="none" stroke="#476f99"  stroke-width="1.6" marker-end="url(#seqArrow)"/></g><g id="07-cloud-preview-s8" class="node" tabindex="0"><title>src/gov_mcp/public_preview.py:LiveVerifier.__call__</title><text x="390.0" y="755" font-size="13" fill="#476f99">9. 返回逐项支持概率与usage</text><path d="M 1160.0 781 L 380.0 781" fill="none" stroke="#476f99" stroke-dasharray="6 4" stroke-width="1.6" marker-end="url(#seqArrow)"/></g><g id="07-cloud-preview-s9" class="node" tabindex="0"><title>src/gov_mcp/public_preview.py:LiveVerifier.__call__</title><text x="390.0" y="835" font-size="13" fill="#476f99">10. LiveVerifier保存实际请求/英文/供应商回执</text><path d="M 380.0 861 L 640.0 861" fill="none" stroke="#476f99"  stroke-width="1.6" marker-end="url(#seqArrow)"/></g><g id="07-cloud-preview-s10" class="node" tabindex="0"><title>src/gov_mcp/public_preview.py:Preview.verify</title><rect x="20" y="898" width="1240" height="70" rx="6" fill="#fff8e9" opacity=".8"/><text x="390.0" y="915" font-size="13" fill="#9b7221">11. TX2：重验context；保存概率、threshold=0.8、回执SHA；can_finalize</text><path d="M 380.0 941 L 640.0 941" fill="none" stroke="#9b7221"  stroke-width="1.6" marker-end="url(#seqArrow)"/></g><g id="07-cloud-preview-s11" class="node" tabindex="0"><title>src/gov_mcp/public_preview.py:Preview.finalize</title><text x="130.0" y="995" font-size="13" fill="#476f99">12. 后续finalize：重验context、回执SHA与已存分数</text><path d="M 120.0 1021 L 380.0 1